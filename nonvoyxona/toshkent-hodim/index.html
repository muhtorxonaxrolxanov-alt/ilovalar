var HO='<h3>🏠 Bosh sahifa</h3><p>Tepada 4 ta xona jonli ko\'rinadi: <b>Ombor</b> (ombor, un/tuz qancha), <b>Hamirchi</b> (necha qop hamir, vazifalar), <b>Yopuvchi</b> (yopilgan non, brak), <b>Sotuvchi</b> (stolda non, sotuv, kassa). Hodim ishlayotgan bo\'lsa ko\'rinib turadi. Ostidagi tugmalar: Do\'konlar, Qaytgan, Hodimlar, Xarajat, Non turlari va boshqalar. Non turlari bo\'limida yangi non qo\'shiladi: nomi, narxi va 1 qop uchun qancha mahsulot (un, tuz...) ketishi yoziladi, busiz non qo\'shilmaydi. Har bir nonning «Retsept» tugmasi bilan keyin o\'zgartirish mumkin.</p>'+
'<h3>🎤 Gapirib yozish</h3><p>Pastdagi mikrofonni bosib, masalan: «Anor do\'koniga o\'n besh ta patir berildi» yoki «gaz uchun yuz ming xarajat» deng. Ilova tushunib, tayyor kartochka chiqaradi, siz tasdiqlaysiz.</p>'+

'<h3>📊 Hisobot</h3><p>Bitta kartada: <b>Non</b> (qilindi, sotildi, brak, qoldi) va <b>Pul</b> (olindi, xarajat, nasiya, qoldi), har biri 1-nonvoyxona va 2-nonvoyxona bo\'yicha. Qatorni bossangiz tafsilot ochiladi. Pastda xarajatlar statistikasi, ombor va qarzlar (do\'konlar va hodimlar) bor. Davrni (bugun, hafta, oy, yil) tepadan tanlaysiz.</p>'+
