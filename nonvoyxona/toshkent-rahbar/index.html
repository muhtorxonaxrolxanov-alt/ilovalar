nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:0 0 auto;padding:14px 13px;border:0;background:none;color:var(--mu);font:inherit;font-size:14px}
nav button.on{color:var(--ac);font-weight:bold;box-shadow:inset 0 3px var(--ac)}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row .n{flex:1}.row small{display:block;color:var(--mu)}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px;margin:8px 0}
button,input,select{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:10px;background:var(--sf);color:var(--tx)}
button.b{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:bold;width:100%;margin-top:4px}
button.x{padding:6px 10px}
input,select{width:100%;margin:3px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:24px;font-weight:bold}.ok{color:var(--ok)}.bad{color:var(--bad)}
h2{font-size:17px;margin:18px 0 4px}.empty{color:var(--mu);padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}
.w{overflow-x:auto}

<h1 style="display:flex;justify-content:space-between;align-items:center"><span id="brsw"></span><button id="gear" onclick="go('set')" style="padding:6px 14px" aria-label="Sozlamalar">⚙</button></h1><div class="sub" id="date" style="display:none"></div>
<main id="app"></main><nav id="nav"></nav>
<script>
var KEY="nonvoyxona_v2",tab="dokon";
var S={breads:[],shops:[],del:[],ret:[],bake:[],sell:[],workers:[],work:[],adv:[],exp:[]};
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S||typeof S!="object")S={};["breads","shops","del","ret","bake","sell","workers","work","adv","exp","mats","srv","gone"].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});
if(!S.mats)S.mats=[];
S.mats=S.mats.filter(function(x){return !(/^m[1-4]$/.test(x.id)&&!x.qty&&!S.bake.some(function(b){return (b.used||[]).some(function(u){return u.m==x.id})}))});
function mn(id){var x=S.mats.find(function(y){return y.id==id});return x?x.name:"?"}
function r3(v){return Math.round(v*1000)/1000}
function toast(t){var e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;left:16px;right:16px;bottom:80px;background:#2b1d12;color:#fff;padding:12px;border-radius:8px;z-index:9;text-align:center";document.body.appendChild(e);setTimeout(function(){e.remove()},2500)}
function ask(msg,withInp,cb){var o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9";o.innerHTML='<div class="tile" style="width:100%;max-width:340px"><div style="margin-bottom:8px">'+msg+'</div>'+(withInp?'<input id="ask_v" type="number" inputmode="decimal" step="any">':'')+'<div class="two" style="margin-top:8px"><button id="ask_n">Bekor</button><button class="b" id="ask_y" style="margin:0">OK</button></div></div>';document.body.appendChild(o);var c=function(){document.body.removeChild(o)};document.getElementById("ask_n").onclick=c;document.getElementById("ask_y").onclick=function(){var v=withInp?+document.getElementById("ask_v").value:1;c();cb(v)};if(withInp)document.getElementById("ask_v").focus()}
function dinp(id,ph){return '<input id="'+id+'" placeholder="'+ph+'" type="number" inputmode="decimal" step="any">'}
function save(){nvStore(KEY,function(){return S});render()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function m(n){return Math.round(n).toLocaleString("ru-RU")+" so'm"}
function uid(){return Date.now()+""+Math.floor(Math.random()*999)}
function D(t){return new Date(t).toDateString()}
function td(a,k){var d=new Date().toDateString();return a.filter(function(x){return D(x[k||"t"])===d})}
function sum(a,k){return a.reduce(function(s,x){return s+(+x[k]||0)},0)}
function V(id){return document.getElementById(id).value}
function N(id){return +V(id)}
function bn(id){var b=S.breads.find(function(x){return x.id==id});return b?b.name:"?"}
function bp(id){var b=S.breads.find(function(x){return x.id==id});return b?b.price:0}
function wn(id){var w=S.workers.find(function(x){return x.id==id});return w?w.name:"?"}
function sel(id,arr){return '<select id="'+id+'">'+arr.map(function(o){return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'}).join("")+'</select>'}
function bsel(id){if(!S.breads.length)return '<div class="empty">Avval «Yopilgan» bo\'limida non turini qo\'shing.</div><input id="'+id+'" type="hidden">';return sel(id,S.breads.map(function(b){return [b.id,b.name+" ("+m(b.price)+")"]}))}
function nb(){if(!S.breads.length){toast("Avval non turini qo'shing (Yopilgan bo'limi)");return 1}}
function pf(){var e=document.getElementById("pr");if(e)e.value=bp(V("b"))}
function pp(b){var v=+V("pr");return v>0?v:bp(b)}
function bselp(id){var h=bsel(id);return S.breads.length?h.replace('<select id="'+id+'">','<select id="'+id+'" onchange="pf()">'):h}
function pri(){var b=S.breads[0];return '<small style="color:var(--mu)">Narxi (1 dona, so\'m) — xohlagancha o\'zgartiring</small>'+(b?inp("pr","Narxi",1).replace('>',' value="'+b.price+'">'):'')}
function eBread(id){var b=S.breads.find(function(x){return x.id==id});var o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9";o.innerHTML='<div class="tile" style="width:100%;max-width:340px"><div style="margin-bottom:8px">Non nomi va narxi</div><input id="en" value="'+esc(b.name)+'"><input id="ep" type="number" inputmode="numeric" value="'+b.price+'"><div class="two" style="margin-top:8px"><button id="en_n">Bekor</button><button class="b" id="en_y" style="margin:0">Saqlash</button></div></div>';document.body.appendChild(o);document.getElementById("en_n").onclick=function(){o.remove()};document.getElementById("en_y").onclick=function(){var n=V("en").trim(),p=N("ep");if(!n||!(p>0))return toast("Nom va narxni kiriting");b.name=n;b.price=p;o.remove();save()}}
function wsel(id){return sel(id,S.workers.map(function(w){return [w.id,w.name]}))}
function inp(id,ph,num){return '<input id="'+id+'" placeholder="'+ph+'"'+(num?' type="number" inputmode="numeric"':'')+'>'}
function row(a,b,c,coll,i){return '<div class="row"><div class="n">'+a+'<small>'+b+'</small></div><b>'+c+'</b><button class="x" onclick="rm(\''+coll+'\',\''+i+'\')">✕</button></div>'}
function rm(c,i){ask("O'chirilsinmi?",0,function(){if(c=="bake"){var b=S.bake.find(function(x){return x.i==i});(b.used||[]).forEach(function(u){var m0=S.mats.find(function(y){return y.id==u.m});if(m0)m0.qty=r3(m0.qty+u.amt)})}S[c]=S[c].filter(function(x){return x.i!=i});save()})}
function bad(){toast("Barcha maydonlarni to'ldiring");return 0}
function tm(t){return new Date(t).toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"})}
function go(t){if(t=="set"&&tab!="set")SS="";tab=t;render()}
function shopAdd(n){if(S.shops.indexOf(n)<0)S.shops.push(n)}
/* actions */
function aDel(){if(nb())return;var s=V("sh").trim(),q=N("q"),b=V("b");if(!s||!(q>0))return bad();shopAdd(s);var p=V("pd")=="1";S.del.push({i:uid(),t:Date.now(),shop:s,b:b,qty:q,amt:q*pp(b),paid:p,pt:p?Date.now():0});save()}
function pay(i){var d=S.del.find(function(x){return x.i==i});d.paid=true;d.pt=Date.now();save()}
function aRet(){if(nb())return;var s=V("sh").trim(),q=N("q"),b=V("b");if(!s||!(q>0))return bad();shopAdd(s);S.ret.push({i:uid(),t:Date.now(),shop:s,b:b,qty:q,amt:q*pp(b)});save()}
function aBake(){if(nb())return;var g=N("g"),q=N("q");if(!(g>0)||!(q>0))return bad();var u=[];for(var k=0;k<S.mats.length;k++){var m0=S.mats[k],a=+V("u_"+m0.id)||0;if(a>0){if(a>m0.qty)return toast(m0.name+" omborda yetarli emas (qoldi: "+m0.qty+" "+m0.unit+")");u.push({m:m0.id,amt:a})}}
u.forEach(function(x){var y=S.mats.find(function(z){return z.id==x.m});y.qty=r3(y.qty-x.amt)});S.bake.push({i:uid(),t:Date.now(),b:V("b"),bags:g,qty:q,used:u});save()}
function aMat(){var n=V("mn").trim(),u=V("mu").trim(),q=+V("mq")||0;if(!n||!u)return bad();S.mats.push({id:uid(),name:n,unit:u,qty:q});save()}
function aIn(id){ask("Nechta kirim bo'ldi?",1,function(v){if(v>0){var m0=S.mats.find(function(y){return y.id==id});m0.qty=r3(m0.qty+v);save()}})}
function rmMat(id){ask("Ombordan o'chirilsinmi?",0,function(){S.mats=S.mats.filter(function(x){return x.id!=id});save()})}
function aSell(){if(nb())return;var q=N("q"),b=V("b");if(!(q>0))return bad();S.sell.push({i:uid(),t:Date.now(),b:b,qty:q,amt:q*pp(b)});save()}
function aBread(){var n=V("bn").trim(),p=N("bp");if(!n||!(p>0))return bad();S.breads.push({id:uid(),name:n,price:p});save()}
function aPrice(id){ask("Yangi narx (so'm). Eski yozuvlar o'zgarmaydi.",1,function(v){if(v>0){S.breads.find(function(x){return x.id==id}).price=v;save()}})}
function rmBread(id){ask("Non turi o'chirilsinmi? Eski yozuvlarda nomi «?» bo'lib qoladi.",0,function(){S.breads=S.breads.filter(function(x){return x.id!=id});save()})}
function aWorker(){var n=V("wn").trim(),r=N("wr");if(!n||!(r>0))return bad();S.workers.push({id:uid(),name:n,rate:r});save()}
function aWork(){var g=N("g");if(!S.workers.length||!(g>0))return bad();S.work.push({i:uid(),t:Date.now(),w:V("w"),bags:g});save()}
function aAdv(){var a=N("a");if(!S.workers.length||!(a>0))return bad();S.adv.push({i:uid(),t:Date.now(),w:V("w"),amt:a});save()}
function aExp(){var d=V("ed").trim(),a=N("ea");if(!d||!(a>0))return bad();S.exp.push({i:uid(),t:Date.now(),d:d,amt:a});save()}
function shopsList(){return '<datalist id="sl">'+S.shops.map(function(s){return '<option value="'+esc(s)+'">'}).join("")+'</datalist><input id="sh" list="sl" placeholder="Do\'kon nomi">'}
/* views */

      { x: 'Olma', h: '🍏 Olma do\'koni', d: 'Xalq Retail (Olma) buyurtmalari. Excel faylni tashlaysiz — ilova o\'zi «berish kerak / berildi / qoldi» deb hisoblaydi. Har do’kon yonida 📅 sana turadi: «berish kerak» — qaysi kun uchun, «berildi» — qaysi kuni nechta berilgan (bugun, kecha yoki 18.11 kabi).' },
      { x: 'berilgan — sonini', h: '✏️ Berilgan — sonini o’zgartirish', d: 'Olma do’koniga oxirgi marta berilgan non (bugun yoki o’tgan kun — ilova o’zi «berildi» qilgan bo’lsa ham, sanasi yoziladi). Ko’p yoki kam yozilgan bo’lsa, sonini to’g’rilab «💾 Saqlash» ni bosing. 0 yozsangiz, o’sha non o’chadi. Toshkent va Namangan ilovasida bir xil.' },
      { x: 'Yopish', h: '✖ Yopish', d: 'Oynadagi «Yopish» bitta qadam orqaga qaytaradi: masalan do’kon oynasidan — do’konlar ro’yxatiga; oyna ichidan boshqa oyna ochilgan bo’lsa — oldingisiga (yozganlaringiz saqlanadi); eng birinchisida — oyna yopiladi. Oynaning tashqarisini yoki telefonning «Orqaga» tugmasini bossangiz ham shunday. Hodim ilovasida ham bir xil.' },
      { x: 'Adashib berilgan', h: '↩️ Adashib berilgan', d: 'Non boshqa do’konga adashib «berildi» qilingan bo’lsa, shu tugmani bosing: bugungi berilganlar bekor bo’ladi va buyurtma yana «berish kerak» ro’yxatiga qaytadi.' },
      { x: 'Namangan', h: '🏭 Namangan', d: 'Namangan ilovasi xuddi shu ilovaning o’zi, tugmalari ham, ishlashi ham bir xil. Farqi bitta: Namangan ma’lumoti Toshkent ilovasiga boradi va shu yerda (Hisobot → 🏭 Namangan) ko’rinadi. Non nomlari (Patir, Lepeshka…) Namangan’da ham Toshkentdagidek chiqadi. Hech narsa ulash shart emas: ilova Namangan bilan o‘zi ulanadi, kod so‘ralmaydi.' },
      { x: 'Mashina', h: '🚚 Mashina', d: 'Mashinaga nechta non yuklandi, do\'konlarga nechtasi berildi va mashinada nechtasi qoldi. Yetmasa ogohlantiradi. Ikki nonvoyxona bo\'lsa, yuklashdan oldin qaysi nonvoyxonadan olinganini bosing: 1- va 2-nonvoyxona nonlari alohida jami bilan turadi. Tepadagi 3 kichik tugma: 📊 Hisobot — yuklandi / berildi / tushirildi / mashinada; 🚚 Yuklangan — har nonvoyxona bo\'yicha jami, non ustiga bossangiz qaysi vaqtda nechta yuklangani chiqadi (🗑 — o\'chirish shu yerda); 📥 Tushirilgan — qaysi nonvoyxonaga tushirilgani va vaqti. Yozuvlar serverga boradi: boshqa telefondagi rahbar ilovasida ham 20–30 soniyada ko\'rinadi; internet bo\'lmasa keyin o\'zi yuboriladi.' },
      { sel: '#dk_loc', h: '📍 Do\'kon lokatsiyasi', d: 'Har do\'konning o\'z joyi. Oddiy do\'kon: do\'kon oynasida, telefon raqami ostida kiritiladi — do\'konda turib «📌 Shu yerdaman»ni bosasiz (telefon ruxsat so\'rasa, ruxsat bering) yoki Google/Yandex xaritadan nusxalangan havolani, «41.31, 69.24» ko\'rinishidagi sonni yoki oddiy manzilni yozasiz. Katakni bo\'shatsangiz — o\'chadi. Olma do\'koni: ko\'pining aniq nuqtasi ilovada tayyor turadi (Olma rasmiy ro\'yxatidan); yo\'g\'i yozuvi bo\'yicha qidiriladi («≈» — taxminiy), «✏️ Aniq lokatsiyani kiritish»dan aniq joyini qo\'ysangiz, o\'sha ishlatiladi. Ro\'yxatdagi 📍 ni bossangiz: 🧭 Google yoki Yandex xaritada borish, ✈️ Yuborish, 📋 Nusxalash. Lokatsiya boshqa rahbar telefonida ham ko\'rinadi.' },
      { sel: '#go_btn', h: '🚗 Joylashuv bo\'yicha ketdikmi?', d: 'Olma ro\'yxatining eng pastida. Bossangiz xarita ochiladi: 🚗 — siz turgan joy (yurganingizda o\'zi siljiydi), 1, 2, 3… — do\'konlar, eng yaqinidan eng uzog\'igacha. Qizil 1 — hozir boradigan do\'kon. Pastdagi ro\'yxatda masofa va qancha non berish kerakligi yoziladi; 🧭 — shu do\'konga Yandex yo\'li, ✓ — non berildi: do\'kon ro\'yxatdan chiqadi va keyingisi 1-bo\'ladi. Qatorni bossangiz, do\'kon oynasi ochiladi (sonini o\'zgartirish). «Berish kerak» — faqat berilmaganlar, «Hammasi» — barcha do\'konlar, «🎯 Men» — xaritani o\'zingizga qaytaradi. Birinchi marta telefon joylashuvga ruxsat so\'raydi — «Ruxsat» bosing.' },
      { sel: '#lo_ch', h: '🔗 Zanjir — hamma Olma do\'konlari ketma-ket', d: 'Bitta Olma do\'konining 📍 belgisini bossangiz, pastda hamma Olma do\'konlari shu do\'kondan boshlab yaqinlik bo\'yicha 1, 2, 3… tartibda chiqadi (har birining yonida oldingisidan taxminiy masofa). Olma ro\'yxatidagi «🔗 Hamma do\'konlar xaritada ketma-ket» ham shu. «Hammasi» — barcha do\'konlar, «Berish kerak» — faqat non berilmaganlari, «📡 Turgan joyimdan» — yo\'l siz turgan joydan boshlanadi. «🧭 Yandex xaritada hammasi» — bitta yo\'lda hammasini ochadi; Google bir safarda 10 tadan ochadi. Raqam rangi: to\'q sariq — berish kerak, yashil — berilgan. Nuqtasi yo\'q do\'kon pastda alohida turadi: bosib, aniq joyini kiritsangiz, zanjirga qo\'shiladi.' },
      { sel: '#dk_tg', h: '📞 Do\'kon telefoni', d: 'Har bir do\'kon oynasida, «Hammasini saqlash» tugmasi ustida. Raqamni yozasiz (masalan 90 123 45 67) — u botga yuboriladi. Keyin «✈️ Ulanish havolasini yuborish»ni bosib, do\'konchiga havolani jo\'nating: do\'konchi havolani ochib START, so\'ng «Raqamni ulashish»ni bir marta bosadi (Telegram qoidasi: bot birinchi yoza olmaydi). Shundan keyin non NASIYAGA berilganda do\'konchiga Telegramdan darhol xabar boradi: qaysi non nechta, jami summa va umumiy qarzi. Naqd yoki karta bilan to\'liq to\'langanda xabar bormaydi. ✅ — ulangan, ⏳ — hali ulanmagan, 🔕 — do\'konchi o\'chirib qo\'ygan.' },
      { x: 'Kun oxiri vaqti', h: '⏰ Kun oxiri vaqti', d: 'Xohlagan vaqtni qo\'ying: soat va daqiqa (masalan 21:35). Ilova ochiq turganda shu vaqtda kun oxiri eslatmasi chiqadi.' },
      { x: 'Tushirib qo\'yildi', h: '📥 Mashinadan tushirib qo\'yildi', d: 'Mashinadagi non nonvoyxonaga tushirilganda yozasiz: 1) qaysi nonvoyxonaga tushirildi; 2) non turi; 3) soni (faqat raqam). Tugmani bossangiz, o\'sha son «Mashinada»dan ayriladi va tepadagi «📥 Tushirilgan» ichida qaysi nonvoyxonaga tushirilgani vaqti bilan turadi. Mashinadagidan ko\'p yozsangiz, ilova avval so\'raydi. Xato bo\'lsa 🗑 bosing — non mashinaga qaytadi.' },
      { x: 'Kassa', h: '💵 Kassa', d: 'Kun davomida kassadan olingan pullarni yozasiz. Kechqurun ilova kassa to\'g\'ri, kam yoki ortiqchaligini o\'zi hisoblaydi. Tepadagi kichik tugmalar: 💸 Olingan — har bir olingan pul va uni bekor qilish; 🧮 Hisob — kassada qancha bo‘lishi kerak; 📅 Kunlar — oxirgi 30 kun; 🏭 Filial — qaysi nonvoyxona.' },
      { x: 'Hodimlar', h: '👷 Hodimlar', d: 'Hodimlar ro\'yxati. Ismini bossangiz — lavozimi, haqi (qop / kunlik / oylik), topgani, olgani, qolgani va davomati chiqadi; shu yerda 💵 Pul berish, ✏️ Tahrirlash, 📋 Davomat yozish, O\'chirish.' },
      { sel: '#hd_add', h: '➕ Hodim qo\'shish', d: 'Ismi, lavozimi, nonvoyxonasi va haqini qanday olishi (🥣 Qopiga, 📅 Kunlik, 🗓 Oylik — bir nechtasini ham tanlash mumkin). Oylikda ertalab keladigan va kechqurun ketadigan vaqti yoziladi: kech kelsa yoki erta ketsa, kam ishlagan daqiqasi oyligidan o\'zi ayriladi (faqat rahbarda ko\'rinadi). Kirish kodi — hodim Sizning raqamingiz va shu kod bilan kiradi.' },
      { sel: '#om_bx', h: '📦 Ombordagi mahsulotlar', d: 'Har mahsulotning hozirgi qoldig\'i. Mahsulotni bossangiz — kun va soat bo\'yicha hamma tushirilganlari, kim tushirgani chiqadi. Kirimni bosib sonini to\'g\'rilash yoki o\'chirish, «✏️ Mahsulotni tahrirlash» bilan qoldiqni o\'zgartirish yoki mahsulotni o\'chirish mumkin. Hodim o\'chira olmaydi.' },
      { x: 'Ma\'lumotlarni tahrirlash', h: '✏️ Ma\'lumotlarni tahrirlash', d: 'Har bo\'lim alohida. 🏪 Do\'konlar → do\'konni bosing → soat bo\'yicha berilgan non, qaytgan non va olingan pul chiqadi → qatorni bosib sonini, summasini o\'zgartirasiz yoki o\'chirasiz. Olingan pul kamaytirilsa, farqi yana qarzga qaytadi. 📦 Ombor ham shu yerda.' },
      { x: 'Xarajat', h: '🧾 Xarajat', d: 'Kunlik xarajatlar: un, gaz, svet va boshqalar. Hisobotda foydadan ayriladi.' },
      { x: 'Non turlari', h: '🍞 Non turlari', d: 'Qanday nonlar yopilishi, narxi va retsepti (1 qop un uchun nima kerak).' },
      { x: 'Hisobot', h: '📊 Hisobot', d: 'Kun, hafta, oy bo\'yicha jami: berilgan non, olingan pul, nasiya, xarajat va foyda.' },
      { sel: '.pxl', h: '🎬 Jonli sahna', d: 'Nonvoyxonaning bugungi holati: omborga nima kirdi, hamirchi necha qop qildi, tandirda necha non yopildi, do\'konlarga qancha ketdi. Hodimlar yozgan zahoti shu yer o\'zgaradi.' },
      { sel: '#fab', h: '🎤 Ovozli yordamchi', d: 'Bosing va gapiring: «Anorga 15 ta patir berildi». Yordamchi nima qilishini ko\'rsatadi, «Ha» desangiz bajaradi.' },
      { sel: '#gear', h: '⚙ Sozlamalar', d: 'Nonvoyxona nomi, bildirishnomalar, ko\'rinish va boshqa sozlamalar.' }] },
    /* ---------- Nonvoyxona: hodim ---------- */
    th: { t: '🥖 Nonvoyxona — hodim', i: 'Hodim ilovasi: hamirchi, yopuvchi yoki sotuvchi ishini yozadi. Yozganlaringiz rahbarga o\'zi boradi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '#ph', h: '📱 Rahbar raqami', d: 'Birinchi marta: rahbaringizning telefon raqamini yozing (o\'zingiznikini emas).' },
      { sel: '#cd2', h: '🔑 Kod', d: 'Rahbar Sizga bergan shaxsiy kodni yozing va «Kirish» ni bosing.' },
      { x: 'Hamir', h: '🥣 Hamir', d: 'Hamirchi: nechta qop hamir qilganingizni yozasiz. Vazifa bajarilsa salyut chiqadi.' },
      { x: 'tandir', h: '🔥 Tandirlar', d: 'Yopuvchi: har tandirda nechta non yopilganini yozasiz (1-tandir, 2-tandir…).' },
      { sel: '#om_new', h: '➕ Yangi mahsulot qo‘shish', d: 'Omborda yo‘q mahsulotni qo‘shadi. Bosilsa oyna ochiladi: nomi, birligi (kg, litr, dona) va hozirgi miqdori (raqam), keyin «Qo‘shish».' },
      { x: 'Davomat', h: '📋 Davomat', d: 'Faqat oylik ishlaydigan hodimlar. Ismini bosib, kelgan va ketgan vaqtini yozasiz (🕒 Hozir — hozirgi vaqtni qo\'yadi) yoki «❌ Kelmadi». O\'tgan kun uchun sanani almashtiring.' },
      { x: 'Yuborish', h: '📤 Yuborish', d: 'Internet bo\'lmasa yozuvlar telefonda saqlanadi. Internet kelganda o\'zi yoki shu tugma bilan rahbarga ketadi.' }] },
    /* ---------- Hisob-kitob ---------- */
    'hk-i': { t: '⚡ Hisob-kitob', i: 'Usta uchun: obyektlar, qilingan ishlar, olingan pul, shogirtlar va hisobot. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { x: 'Shit sxemasi', h: '📐 Shit sxemasi', d: 'Shitni haqiqiy avtomatlar bilan yig\'ib, narxini hisoblaydi.' },
      { x: 'Santexnika', h: '🚿 Santexnika sxemasi', d: 'Qozonxona, kollektor va quvurlar bilan sxema va narx.' },
      { x: 'Hisob-kitob', h: '🧾 Hisob-kitob', d: 'Asosiy bo\'lim: obyektlar, ishlar, pullar, shogirtlar.' },
      { sel: '#payb', h: '💳 To\'lov', d: 'Obunani uzaytirish: tarifni tanlab, kartaga o\'tkazasiz va chek rasmini yuborasiz.' },
      { sel: '#prof', h: '👤 Profil', d: 'Sohangiz, parolni o\'zgartirish va ilovadan chiqish.' }] },
    'hk-h': { t: '🧾 Hisob-kitob', i: 'Obyektlar, shogirtlar va hisobot. Hamma yozuv bulutga o\'zi saqlanadi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '#hkm', h: '🎤 Ovoz bilan yozish', d: 'O’ng pastdagi qizil 🎤. Avval yozmoqchi bo’lgan maydonni bosing, keyin 🎤 ni bosib gapiring, tugatgach yana bosing — gap shu maydonga yoziladi (raqam maydoniga faqat son). Birinchi marta «Mikrofonga ruxsat berasizmi?» chiqadi — «Ruxsat berish» ni bosing.' },
      { sel: '#t1', h: '🏗 Obyektlar', d: 'Ish qilayotgan joylaringiz. Obyektni bossangiz: qilingan ishlar va olingan pullar.' },
      { sel: '#oq', h: '🔍 Qidiruv', d: 'Obyektni nomi, mijoz ismi yoki raqami bo\'yicha tez topish.' },
      { sel: '#addBtn', h: '➕ Qo\'shish', d: 'Yangi obyekt (yoki Shogirtlar bo\'limida — yangi shogird) qo\'shish.' },
      { sel: '[data-a="additem"]', h: '➕ Ish / tochka', d: 'Qilingan ish: nima ish, nechta, bittasi necha pul.' },
      { sel: '[data-a="addrecv"]', h: '💵 Olingan pul', d: 'Mijozdan olingan pulni yozasiz. Keyin mijozga chek yuborish taklif qilinadi.' },
      { sel: '#t4', h: '💸 Xarajatlar', d: 'Rasxodlaringizni yozib borasiz. Obyektni (yoki «📦 Umumiy») bosing, turini tanlang — 🧱 Material, 🚕 Yo’l, 🍽 Ovqat, 🔧 Asbob, 👷 Usta, 📦 Boshqa — summani yozib «Saqlash». Xarajat obyekt sahifasida, Hisobotda va «O’zimga qolgan»da hisoblanadi. Mijozga ko’rsatiladigan hisobda chiqmaydi.' },
      { sel: '.bzbig', h: '🛒 Bozordan olingan tovarlar', d: 'Bozordan material olsangiz shu yerga yozasiz. Bosing → «📷 Rasmga olish» (chek, nakladnoy yoki qo‘lda yozilgan qog‘oz) — sun’iy intellekt rasmni o‘qib, har bir tovarni nomi, soni va 1 dona narxi bilan ro‘yxat qiladi, summani o‘zi hisoblaydi (10–30 soniya). «🖼 Rasm tanlash» — galereyadagi rasm (bir nechtasini birdan tanlasa bo‘ladi). «✍️ Matndan» — har qatorga bitta tovar yozasiz, masalan «rozetka 5 ta 25 ming». Ro‘yxatni tekshiring: noto‘g‘ri bo‘lsa katakni bosib to‘g‘rilang, «✕» — qatorni o‘chirish, «+ Qator qo‘shish» — qo‘lda qo‘shish. Narxi yozilmagan tovar qizil ramkada. Oxirida «✓ Saqlash».' },
      { sel: '.bzmz', h: '🏠 Mijoz to‘laydi', d: 'Belgi qo‘yilgan bo‘lsa (odatda shunday), bozor ro‘yxati uy egasiga yuboriladigan hisobda («Mijozga ko‘rsatish», rasm va matn) alohida «🛒 Bozordan olingan tovarlar» bo‘limi bo‘lib chiqadi: har bir tovar, soni, narxi va «Bozor jami». Bu summa «Jami narx» va «Qolgan pul»ga qo‘shiladi. Belgini olib tashlasangiz — faqat o‘zingizning xarajatingiz bo‘lib qoladi.' },
      { sel: '[data-ecat]', h: '⚡ Tez yozish', d: 'Turini bosing — oyna o’sha tur bilan ochiladi, faqat summani yozasiz. Noto’g’ri yozilganini ✕ bilan o’chirasiz.' },
      { sel: '#t2', h: '👷 Shogirtlar', d: 'Shogirtlar: kunlik haqi, ishlagan kunlari, berilgan pul va qarz. «📤 Ilovaga taklif» bilan shogirdga havola yuborasiz.' },
      { sel: '[data-cinv]', h: '📤 Ilovaga taklif', d: 'Shogirdga havola yuboradi. U havolani ochib, parol qo\'yadi va obyektlaringizda «ishladim» deb yoza oladi.' },
      { sel: '#t3', h: '📊 Hisobot', d: 'Jami olingan pul, mijozlardan qolgan qarz, shogirtlarga berilgan pul va qarz, obyektlar bo\'yicha shogirdlar.' },
      { sel: '[data-a="gear"]', h: '⚙ Sozlamalar', d: 'Profil, ilova nomi va belgisi, ko\'rinish, zaxira nusxa.' }] },
    'hk-sg': { t: '👷 Shogird', i: 'Ustangizning obyektlarida ishlagan kunlaringizni yozasiz. Ustangiz ham ko\'radi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '.obj', h: '🏗 Obyekt', d: 'Qaysi obyektda ishlagan bo\'lsangiz, shuni bosing → necha kun → «Yozish».' },
      { sel: '#tM', h: '💰 Hisobim', d: 'Kunlik haqingiz, ishlagan kunlaringiz, olgan va olishingiz kerak bo\'lgan pul.' },
      { sel: '#tS', h: '⚙ Sozlamalar', d: 'Yangilash va ilovadan chiqish.' }] },
    gate: { t: '🔐 Kirish', i: 'Birinchi marta «Ro\'yxatdan o\'tish», keyingi safar «Kirish» (raqam va parol). ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '#tL', h: 'Kirish', d: 'Oldin ro\'yxatdan o\'tgan bo\'lsangiz: telefon raqam va parol.' },
      { sel: '#tR', h: 'Ro\'yxatdan o\'tish', d: 'Birinchi marta shu yerni bosing.' },
      { sel: '#forgot', h: 'Parolni unutdim', d: 'Telegramga kod keladi, u bilan yangi parol qo\'yasiz.' },

    /* ---------- Elektr Do'kon ---------- */
    em: { t: '💡 Elektr Do\'kon', i: 'Tovarlarni ko\'rib, savatchaga solib, buyurtma berasiz. Do\'kon manzilingizga olib boradi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { x: 'Ro\'yxatdan o\'tish', h: 'Ro\'yxatdan o\'tish', d: 'Birinchi marta: raqam va parol. Bepul.' },
      { x: 'Kirish', h: 'Kirish', d: 'Keyingi safar: raqam va parol. Parolni unutsangiz — kod bilan tiklanadi.' },
      { sel: 'input[type=search],input[placeholder*="idir"]', h: '🔍 Qidiruv', d: 'Tovar nomini yozing (masalan «kabel»). Xato yozsangiz ham topadi.' },
