 * Faqat haqiqiy AndroidBridge YO'Q joyda ishlaydi. build_web.py har bir sahifaning eng boshiga qo'yadi. */
(function () {
  if (window.AndroidBridge) return;
  window.HKWEB = 1;
  var tg = window.Telegram && window.Telegram.WebApp;
  function toFile(b64, name, type) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new File([u], name || 'rasm.png', { type: type || 'image/png' });
  }
  function download(f) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function copy(t) {
    try { if (navigator.clipboard) { navigator.clipboard.writeText(String(t)); return; } } catch (e) {}
    try { var x = document.createElement('textarea'); x.value = String(t); document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); } catch (e) {}
  }
  function open(u) {
    try { if (tg && /^https?:/i.test(u)) { if (/^https?:\/\/t\.me\//i.test(u) && tg.openTelegramLink) tg.openTelegramLink(u); else tg.openLink(u); return; } } catch (e) {}
    try { if (/^https?:/i.test(u)) { if (!window.open(u, '_blank')) location.href = u; } else location.href = u; } catch (e) { location.href = u; }
  }
  window.AndroidBridge = {
    copy: copy,
    open: open,
    share: function (text) {
      try { if (navigator.share) { navigator.share({ text: String(text) }).catch(function () {}); return; } } catch (e) {}
      copy(text); try { alert("Matn nusxalandi. Kerakli joyga qo'ying."); } catch (e) {}
    },
    shareImage: function (b64, name) {
      var f = toFile(b64, name);
      try { if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(function () {}); return; } } catch (e) {}
      download(f);
    },
    saveBackup: function (t) { try { localStorage.setItem('hk_web_backup', String(t)); } catch (e) {} },
    readBackup: function () { try { return localStorage.getItem('hk_web_backup') || ''; } catch (e) { return ''; } },
    bg: function (hex) {
      try {
        var m = document.querySelector('meta[name=theme-color]');
        if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
        m.content = hex; if (tg && tg.setHeaderColor) { tg.setHeaderColor(hex); tg.setBackgroundColor(hex); }
      } catch (e) {}
    }
    // sendTg va pinShortcut ataylab yo'q: ilova o'zining veb-yo'lini ishlatadi
  };
  try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}

  /* Telegram ichida (Mini App) Telegram keshni tozalasa, telefondagi kirish ham o'chib, ma'lumot "yo'qolgandek" ko'rinardi.
     Endi kirish (hk_lic) va bulut kaliti Telegramning o'z bulutida (CloudStorage) ham saqlanadi va kerak bo'lsa o'zi qaytadi. */
  var CS = tg && tg.initData && tg.CloudStorage;
  if (CS) {
    var ls = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; };
    window.HK_ONCLEAR = function () { try { CS.removeItems(['hk_lic', 'hk_cloud']); } catch (e) {} };
    if (!ls('hk_lic')) {
      window.HK_HOLD = 1; document.documentElement.style.visibility = 'hidden';
      var done = false, fin = function () {
        if (done) return; done = true; window.HK_HOLD = 0; document.documentElement.style.visibility = '';
        var l = null; try { l = JSON.parse(ls('hk_lic') || 'null'); } catch (e) {}
        if (!(l && l.ok && l.until > Date.now()) && !/gate\.html$/.test(location.pathname)) location.replace('gate.html');
      };
      try {
        CS.getItems(['hk_lic', 'hk_cloud'], function (err, v) {
          try {
            if (!err && v && v.hk_lic) {
              ls('hk_lic', v.hk_lic);
              if (v.hk_cloud && !ls('cloud_v1')) { var c = JSON.parse(v.hk_cloud); c.exp = 0; c.lastUpd = 0; c.lastRemote = 0; ls('cloud_v1', JSON.stringify(c)); }
              done = true; location.reload(); return;
            }
          } catch (e) {}
          fin();
        });
      } catch (e) { fin(); }
      setTimeout(fin, 5000);
    }
    var last = '';
    var put = function () {
      try {
        var l = ls('hk_lic') || '', c = JSON.parse(ls('cloud_v1') || 'null');
        var cc = c && c.uid && c.rt ? JSON.stringify({ cfg: c.cfg, phone: c.phone, uid: c.uid, rt: c.rt }) : '';
        var k = l + '|' + cc; if (!l || k === last) return; last = k;
        CS.setItem('hk_lic', l); if (cc) CS.setItem('hk_cloud', cc);
      } catch (e) {}
    };
    setTimeout(put, 4000); setInterval(put, 30000);
    document.addEventListener('visibilitychange', function () { if (document.hidden) put(); });
  }
})();
