<!DOCTYPE html>
<html lang="uz">
<head><meta charset="utf-8"><meta name="theme-color" content="#1d4ed8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hisob-kitob"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png"><script src="https://telegram.org/js/telegram-web-app.js"></script><script>/* Hisob-kitob — veb-ilova (iPhone, kompyuter, Telegram Mini App) uchun AndroidBridge o'rnini bosuvchi.
 * Faqat haqiqiy AndroidBridge YO'Q joyda ishlaydi. build_web.py har bir sahifaning eng boshiga qo'yadi. */
(function () {
  if (window.AndroidBridge) return;
  window.HKWEB = 1;
  var tg = window.Telegram && window.Telegram.WebApp;
  function toFile(b64, name, type) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new File([u], name || 'rasm.png', { type: type || 'image/png' });
  }
  function download(f) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function copy(t) {
    try { if (navigator.clipboard) { navigator.clipboard.writeText(String(t)); return; } } catch (e) {}
    try { var x = document.createElement('textarea'); x.value = String(t); document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); } catch (e) {}
  }
  function open(u) {
    try { if (tg && /^https?:/i.test(u)) { if (/^https?:\/\/t\.me\//i.test(u) && tg.openTelegramLink) tg.openTelegramLink(u); else tg.openLink(u); return; } } catch (e) {}
    try { if (/^https?:/i.test(u)) { if (!window.open(u, '_blank')) location.href = u; } else location.href = u; } catch (e) { location.href = u; }
  }
  window.AndroidBridge = {
    copy: copy,
    open: open,
    share: function (text) {
      try { if (navigator.share) { navigator.share({ text: String(text) }).catch(function () {}); return; } } catch (e) {}
      copy(text); try { alert("Matn nusxalandi. Kerakli joyga qo'ying."); } catch (e) {}
    },
    shareImage: function (b64, name) {
      var f = toFile(b64, name);
      try { if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(function () {}); return; } } catch (e) {}
      download(f);
    },
    saveBackup: function (t) { try { localStorage.setItem('hk_web_backup', String(t)); } catch (e) {} },
    readBackup: function () { try { return localStorage.getItem('hk_web_backup') || ''; } catch (e) { return ''; } },
    bg: function (hex) {
      try {
        var m = document.querySelector('meta[name=theme-color]');
        if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
        m.content = hex; if (tg && tg.setHeaderColor) { tg.setHeaderColor(hex); tg.setBackgroundColor(hex); }
      } catch (e) {}
    }
    // sendTg va pinShortcut ataylab yo'q: ilova o'zining veb-yo'lini ishlatadi
  };
  try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}

  /* Telegram ichida (Mini App) Telegram keshni tozalasa, telefondagi kirish ham o'chib, ma'lumot "yo'qolgandek" ko'rinardi.
     Endi kirish (hk_lic) va bulut kaliti Telegramning o'z bulutida (CloudStorage) ham saqlanadi va kerak bo'lsa o'zi qaytadi. */
  var CS = tg && tg.initData && tg.CloudStorage;
  if (CS) {
    var ls = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; };
    window.HK_ONCLEAR = function () { try { CS.removeItems(['hk_lic', 'hk_cloud']); } catch (e) {} };
    if (!ls('hk_lic')) {
      window.HK_HOLD = 1; document.documentElement.style.visibility = 'hidden';
      var done = false, fin = function () {
        if (done) return; done = true; window.HK_HOLD = 0; document.documentElement.style.visibility = '';
        var l = null; try { l = JSON.parse(ls('hk_lic') || 'null'); } catch (e) {}
        if (!(l && l.ok && l.until > Date.now()) && !/(gate|murojaat)\.html$/.test(location.pathname)) location.replace('gate.html');
      };
      try {
        CS.getItems(['hk_lic', 'hk_cloud'], function (err, v) {
          try {
            if (!err && v && v.hk_lic) {
              ls('hk_lic', v.hk_lic);
              if (v.hk_cloud && !ls('cloud_v1')) { var c = JSON.parse(v.hk_cloud); c.exp = 0; c.lastUpd = 0; c.lastRemote = 0; ls('cloud_v1', JSON.stringify(c)); }
              done = true; location.reload(); return;
            }
          } catch (e) {}
          fin();
        });
      } catch (e) { fin(); }
      setTimeout(fin, 5000);
    }
    var last = '';
    var put = function () {
      try {
        var l = ls('hk_lic') || '', c = JSON.parse(ls('cloud_v1') || 'null');
        var cc = c && c.uid && c.rt ? JSON.stringify({ cfg: c.cfg, phone: c.phone, uid: c.uid, rt: c.rt }) : '';
        var k = l + '|' + cc; if (!l || k === last) return; last = k;
        CS.setItem('hk_lic', l); if (cc) CS.setItem('hk_cloud', cc);
      } catch (e) {}
    };
    setTimeout(put, 4000); setInterval(put, 30000);
    document.addEventListener('visibilitychange', function () { if (document.hidden) put(); });
  }
})();
</script><script src="gate.js"></script>

<script>
const TK='theme_v1',TD={mode:'auto',acc:'',bg:'',card:'',text:'',sz:'m'};
let TH=Object.assign({},TD);
try{Object.assign(TH,JSON.parse(localStorage.getItem(TK)||'{}'))}catch(e){}
const saveTheme=()=>{try{localStorage.setItem(TK,JSON.stringify(TH))}catch(e){}};
const ZOOM={s:.9,m:1,l:1.12,xl:1.25};
function applyTheme(){const r=document.documentElement;
  if(TH.mode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',TH.mode);
  [['acc','--acc'],['bg','--bg'],['card','--card'],['text','--text']].forEach(function(p){TH[p[0]]?r.style.setProperty(p[1],TH[p[0]]):r.style.removeProperty(p[1])});
  try{document.querySelector('main').style.zoom=ZOOM[TH.sz]||1}catch(e){}
  try{if(window.AndroidBridge){var b=getComputedStyle(r).getPropertyValue('--bg').trim();if(b)AndroidBridge.bg(b)}}catch(e){}
}
function themeCard(){
  const cv=(k,v)=>TH[k]||getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#000000';
  const m=(k,l)=>'<button class="b'+(TH.mode===k?' p':'')+'" data-tm="'+k+'">'+l+'</button>';
  const z=(k,l)=>'<button class="b'+(TH.sz===k?' p':'')+'" data-tz="'+k+'">'+l+'</button>';
  const c=(k,v,l)=>'<div class="row" style="align-items:center;padding:6px 0"><span>'+l+'</span><input type="color" data-tc="'+k+'" value="'+cv(k,v)+'" style="width:56px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:none"></div>';
  return'<div class="card"><h3>Fon rejimi</h3><div class="acts">'+m('light','Yorug\'')+m('dark','Qorong\'u')+m('auto','Avto')+'</div></div>'+
  '<div class="card"><h3>Yozuv o\'lchami</h3><div class="acts">'+z('s','Kichik')+z('m','O\'rta')+z('l','Katta')+z('xl','Juda katta')+'</div></div>'+
  '<div class="card"><h3>Ranglar</h3><div class="hint">Istalgan joyni o\'zingiz tanlab bo\'yang</div>'+c('acc','--acc','Tugma va asosiy rang')+c('bg','--bg','Orqa fon')+c('card','--card','Kartalar rangi')+c('text','--text','Yozuv rangi')+'<div class="acts"><button class="b" data-treset="1">Asliga qaytarish</button></div></div>';
}
document.addEventListener('input',function(e){const k=e.target.dataset&&e.target.dataset.tc;if(k){TH[k]=e.target.value;saveTheme();applyTheme()}});
document.addEventListener('click',function(e){const t=e.target.closest('[data-tm],[data-treset],[data-tz]');if(!t)return;
  if(t.dataset.treset){TH=Object.assign({},TD)}else if(t.dataset.tz){TH.sz=t.dataset.tz}else{TH.mode=t.dataset.tm;TH.bg='';TH.card='';TH.text=''}
  saveTheme();applyTheme();if(window.render)render()});
const NAVSTACK=[];
window.__back=function(){const d=document.getElementById('dlg');if(d&&d.open){d.close();return true}
  if(NAVSTACK.length&&window.__restore){window.__restore(NAVSTACK.pop());return true}return false};
applyTheme();

const hasB=m=>{try{return !!(window.AndroidBridge&&typeof window.AndroidBridge[m]==='function')}catch(e){return false}};
const KEY='hisobchi_v2';
let S={objects:[],workers:[],secret:'',accent:'#2563eb',title:'',prof:{name:'',role:'',phone:''},last:null,logo:'',home:''},tab=1,cur=null,cl=false,rep=null,set=false,sec='',ecur=null,bzi=null,BZD=null;
const $=id=>document.getElementById(id);
function migrate(){try{const o=JSON.parse(localStorage.getItem('hisob_local_db_v1')||'null');if(!o)return;
  S.objects=Object.keys(o.objects||{}).map(id=>Object.assign({id},o.objects[id]));
  S.workers=Object.keys(o.wd||{}).map(id=>{const w=o.wd[id],fi=(o.fin||{})[id]||{};return{id,name:w.name,phone:'',rate:+fi.rate||0,entries:w.entries||[],pays:(fi.pays||[]).map(p=>({id:p.id,a:p.a,date:p.date}))}})}catch(e){}}
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));else migrate()}catch(e){}
/* Ma'lumot qaysi raqamniki: boshqa raqam bilan kirilsa, oldingisi alohida saqlanadi va ilova bo'sh ochiladi */
(function(){try{const me=String(((window.HK&&HK.lic())||{}).phone||'');if(!me)return;
  if(S.own&&S.own!==me){localStorage.setItem(KEY+'@'+S.own,JSON.stringify(S));
    const keep={accent:S.accent};S={objects:[],workers:[],secret:'',accent:keep.accent||'#2563eb',title:'',prof:{name:'',role:'',phone:''},last:null,logo:'',home:'',del:{}};
    const sv=localStorage.getItem(KEY+'@'+me);if(sv){try{Object.assign(S,JSON.parse(sv))}catch(e){}}
    try{const c=JSON.parse(localStorage.getItem('cloud_v1')||'null');if(c){c.lastUpd=0;c.lastRemote=0;localStorage.setItem('cloud_v1',JSON.stringify(c))}}catch(e){}}
  S.own=me;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}})();
if(!S.secret)S.secret=Math.random().toString(36).slice(2,10);
if(!S.prof)S.prof={name:'',role:'',phone:''};
/* Mijoz maydoniga telefon raqam yozilgan eski obyektlar: raqamni telefon joyiga ko'chirish */
S.objects.forEach(o=>{if(!o.phone&&/^[+\d\s()-]{9,}$/.test(String(o.client||'').trim())){o.phone=o.client.trim();o.client=''}});
let bkT=0;
/* Bulut uchun: har bir yozuvda id bo'lishi kerak */
function ensureIds(){S.del=S.del||{};S.objects.forEach(o=>{o.id=o.id||uid();(o.items=o.items||[]).forEach(i=>{if(!i.id)i.id=uid()});(o.recv=o.recv||[]).forEach(r=>{if(!r.id)r.id=uid()});(o.exp=o.exp||[]).forEach(x=>{if(!x.id)x.id=uid()})});(S.gexp=S.gexp||[]).forEach(x=>{if(!x.id)x.id=uid()});S.workers.forEach(w=>{w.id=w.id||uid();(w.entries=w.entries||[]).forEach(e=>{if(!e.id)e.id=uid()});(w.pays=w.pays||[]).forEach(p=>{if(!p.id)p.id=uid()})})}
const tomb=id=>{S.del=S.del||{};S.del[String(id)]=Date.now()};
let lastHash=null,pushT=0;
const dataKeys=['objects','workers','gexp','title','prof','home','logo','secret'];
const dataHash=()=>JSON.stringify(dataKeys.map(k=>S[k]));
const save=()=>{if(window.ensureIds)ensureIds();if(lastHash===null)lastHash=dataHash();else{const h=dataHash();if(h!==lastHash){lastHash=h;S.upd=Date.now();if(window.cloudPush)cloudPush()}}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  /* Telefon ilovasida: har o'zgarishdan keyin zaxira faylga o'zi yoziladi (bo'sh holatda yozilmaydi) */
  if(hasB('saveBackup')&&(S.objects.length||S.workers.length)){clearTimeout(bkT);bkT=setTimeout(()=>{try{AndroidBridge.saveBackup(backupText())}catch(e){}},1500)}};
const getState=()=>({tab,cur,cl,rep,set,sec,ecur,bzi});
const nav=fn=>{NAVSTACK.push(getState());fn();render()};
window.__restore=s=>{tab=s.tab;cur=s.cur;cl=s.cl;rep=s.rep;set=s.set;sec=s.sec||'';ecur=s.ecur||null;bzi=s.bzi==null?null:s.bzi;if(bzi==null)BZD=null;render()};
const f=n=>Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ')+" so'm";
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const sm=a=>a.reduce((x,y)=>x+y,0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function h53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}

/* Nusxalash: AndroidBridge, keyin clipboard, keyin belgilab nusxalash. Natija: true/false */
async function copy(t){
  try{if(window.AndroidBridge){AndroidBridge.copy(t);return true}}catch(e){}
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return !!ok}catch(e){}
  return false;
}

/* Ishlarni ilovaga kiritish: shogird xabari (HISOB|...) va Telegram bot satrlari (BOT|..., BOTPAY|...) */
function processImport(text){
  let ok=0,dup=0,bad=0,unk=0,pays=0,created=0;
  String(text).split(/\r?\n/).forEach(line=>{
    line=line.replace(/<\/?code>/g,'').trim();
    if(line.indexOf('HISOB|')===0){
      const p=line.split('|'),ph=p[1],code=p[2],id=p[3],date=p[4],days=+p[5],place=p.slice(6).join('|');
      const w=S.workers.find(x=>x.phone&&norm(x.phone)===norm(ph));
      if(!w){unk++;return}
      if(code!==codeFor(w.phone)){bad++;return}
      if((w.entries||[]).some(e=>e.id===id)){dup++;return}
      if(!(days>0)||!date){bad++;return}
      (w.entries=w.entries||[]).push({id,date,place,days});ok++;return;
    }
    const isE=line.indexOf('BOT|')===0,isP=line.indexOf('BOTPAY|')===0;
    if(!isE&&!isP)return;
    const p=line.split('|'),id=p[1],name=p[2];
    if(!id||!name){bad++;return}
    let w=S.workers.find(x=>lc(x.name)===lc(name));
    if(!w){w={id:uid(),name:name,role:'Shogird',phone:'',rate:0,entries:[],pays:[]};S.workers.push(w);created++}
    if(isE){
      const date=p[3],days=+p[4],place=p.slice(5).join('|')||'—';
      if(!(days>0)||!date){bad++;return}
      if((w.entries=w.entries||[]).some(e=>e.id===id)){dup++;return}
      w.entries.push({id,date,place,days});ok++;
    }else{
      const date=p[3],a=+p[4];
      if(!(a>0)||!date){bad++;return}
      if((w.pays=w.pays||[]).some(e=>String(e.id)===id)){dup++;return}
      w.pays.push({id,a,date});pays++;
    }
  });
  if(ok||pays||created)S.last={t:new Date().toLocaleString('ru-RU'),ok:ok,pays:pays};
  save();
  return{ok,dup,bad,unk,pays,created};
}

let OQ='';
const CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'i','ь':'','э':'e','ю':'yu','я':'ya','ў':'o','қ':'q','ғ':'g','ҳ':'h'};
function nrm(s){s=String(s||'').toLowerCase().replace(/[ʻʼ'’`´‘]/g,'').replace(/[а-яёўқғҳ]/g,c=>CYR[c]!=null?CYR[c]:c);return s.replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function oScore(o,q){const qs=nrm(q).split(' ').filter(Boolean);if(!qs.length)return 1;const words=nrm([o.name,o.client,o.phone,o.addr].join(' ')).split(' ').filter(Boolean);let sc=0;
 for(const t of qs){let best=0;for(const w of words){let s=0;if(w===t)s=4;else if(w.startsWith(t))s=3;else if(t.length>=2&&w.includes(t))s=2;else if(t.length>=4&&lev(w.slice(0,t.length),t)<=1)s=1;if(s>best)best=s}if(!best)return 0;sc+=best}return sc}

  if(rep==='out'){const L=[];S.workers.forEach(w=>(w.pays||[]).forEach(p=>L.push({date:p.date,n:w.name,a:+p.a||0})));L.sort(byDate);

  if(rep==='debt')return back+'<div class="card"><h3>Shogirtlarga qarz</h3>'+row('Jami',f(gd),gd>0?'bad':'ok')+(S.workers.length?S.workers.map(w=>{const s=ws(w);return tx(esc(w.name)+'<br><small style="color:var(--muted)">'+s.days+' kun · hisoblangan '+f(s.earned)+' · berilgan '+f(s.paid)+'</small>','<b class="'+(s.debt>0?'bad':'ok')+'">'+f(s.debt)+'</b>')}).join(''):'<div class="hint">Hali shogird yo\'q</div>')+'</div>';
  return'<div class="card click" data-rep="in"><h3>Olingan pullar</h3><b class="ok" style="font-size:18px">'+f(gi)+'</b></div>'+
  '<div class="card click" data-rep="left"><h3>Qolgan pullar (mijozlardan)</h3><b class="'+(gt-gi>0?'bad':'')+'" style="font-size:18px">'+f(gt-gi)+'</b></div>'+

function mergeData(A,B,ua,ub){
  const aNew=(+ua||0)>=(+ub||0),base=clone(aNew?A:B),other=aNew?B:A;
  const del=Object.assign({},A.del||{},B.del||{}),cut=Date.now()-90*864e5;Object.keys(del).forEach(k=>{if(del[k]<cut)delete del[k]});

  const byId=(y,x)=>sid(y)===sid(x);
  base.objects=base.objects||[];base.workers=base.workers||[];
  base.objects=addMissing(base.objects,other.objects,byId);
  base.objects.forEach(o=>{const oo=(other.objects||[]).find(x=>byId(x,o));if(oo){o.items=addMissing(o.items||[],oo.items,byId);o.recv=addMissing(o.recv||[],oo.recv,byId);o.exp=addMissing(o.exp||[],oo.exp,byId)}else{o.items=(o.items||[]).filter(x=>!dead(x));o.recv=(o.recv||[]).filter(x=>!dead(x));o.exp=(o.exp||[]).filter(x=>!dead(x))}});
  const wm=(y,x)=>byId(y,x)||lc(y.name)===lc(x.name);
  base.workers=addMissing(base.workers,other.workers,wm);
  base.workers.forEach(w=>{const ow=(other.workers||[]).find(x=>wm(x,w));if(ow){w.entries=addMissing(w.entries||[],ow.entries,byId);w.pays=addMissing(w.pays||[],ow.pays,byId)}else{w.entries=(w.entries||[]).filter(x=>!dead(x));w.pays=(w.pays||[]).filter(x=>!dead(x))}});
  base.gexp=addMissing(base.gexp||[],other.gexp,byId);
  ['title','prof','home','logo','secret'].forEach(k=>{if(base[k]==null||base[k]==='')if(other[k]!=null)base[k]=other[k]});
  base.del=del;return base;
}
