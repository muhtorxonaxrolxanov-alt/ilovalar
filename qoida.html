<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bulut qoidasi</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#14171f;--mu:#636b7d;--ac:#2563eb;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#171b24;--tx:#eef0f6;--mu:#9aa3b5;--ac:#5b8cff;--ok:#4ade80}}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,sans-serif;padding:20px 16px}
.w{max-width:480px;margin:0 auto}.c{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
.n{display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;text-align:center;line-height:30px;font-weight:800;margin-right:8px}
button,a.b{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:16px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:18px;font-weight:800;text-align:center;text-decoration:none}
.ok{color:var(--ok);font-weight:700}small{color:var(--mu)}
</style></head><body><div class="w">
<h2>Bulut qoidasini qo'yish</h2>
<div class="c"><span class="n">1</span><b>Matnni nusxalang</b><button id="cp">📋 Nusxalash</button><div id="st" class="ok"></div></div>
<div class="c"><span class="n">2</span><b>Firebase'ni oching</b><a class="b" href="https://console.firebase.google.com/project/elektrik-hisob/firestore/rules" target="_blank" rel="noopener">🔥 Firebase'ni ochish</a>
<small>U yerda matn yozilgan oynani bosing → hammasini o'chiring → <b>joylang (Вставить)</b> → yuqoridagi <b>Publish</b> tugmasini bosing.</small></div>
<textarea id="r" readonly style="position:absolute;left:-9999px">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function mail() { return request.auth != null ? request.auth.token.email : ''; }
    function isBot() { return mail() == 'p998913454115@hisobkitob.app'; }
    match /hisob/{uid} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
    match /gate/{id} {
      allow read, write: if mail() == 'gate@hisobkitob.app' || isBot();
    }
    match /lic/{phone} {
      allow read: if mail() == 'p' + phone + '@hisobkitob.app' || isBot();
      allow write: if isBot();
    }
    match /app/{doc} {
      allow read: if request.auth != null;
      allow write: if isBot();
    }
    match /crew/{u} {
      allow read: if request.auth != null && (request.auth.uid == u || request.auth.uid in resource.data.m || isBot());
      allow create: if isBot() || (request.auth != null && request.auth.uid == u && request.resource.data.keys().hasOnly(['o']));
      allow update: if isBot() || (request.auth != null && request.auth.uid == u && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['o']));
      match /log/{s} {
        allow read: if request.auth != null && (request.auth.uid == u || request.auth.uid == s);
        allow write: if request.auth != null && request.auth.uid == s && s in get(/databases/$(database)/documents/crew/$(u)).data.m;
      }
      match /pay/{s} {
        allow read: if request.auth != null && (request.auth.uid == u || request.auth.uid == s);
        allow write: if request.auth != null && request.auth.uid == u;
      }
    }
  }
}</textarea>
<script>
document.getElementById('cp').onclick=function(){var t=document.getElementById('r');var done=function(){document.getElementById('st').textContent='✅ Nusxalandi. Endi 2-qadam.'};
  if(navigator.clipboard){navigator.clipboard.writeText(t.value).then(done,function(){t.select();document.execCommand('copy');done()})}else{t.select();document.execCommand('copy');done()}};
</script>
</div></body></html>
