<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="theme-color" content="#15803d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shogird"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png"><script src="https://telegram.org/js/telegram-web-app.js"></script><script>/* Hisob-kitob — veb-ilova (iPhone, kompyuter, Telegram Mini App) uchun AndroidBridge o'rnini bosuvchi.
 * Faqat haqiqiy AndroidBridge YO'Q joyda ishlaydi. build_web.py har bir sahifaning eng boshiga qo'yadi. */
(function () {
  if (window.AndroidBridge) return;
  window.HKWEB = 1;
  var tg = window.Telegram && window.Telegram.WebApp;
  function toFile(b64, name, type) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new File([u], name || 'rasm.png', { type: type || 'image/png' });
  }
  function download(f) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function copy(t) {
    try { if (navigator.clipboard) { navigator.clipboard.writeText(String(t)); return; } } catch (e) {}
    try { var x = document.createElement('textarea'); x.value = String(t); document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); } catch (e) {}
  }
  function open(u) {
    try { if (tg && /^https?:/i.test(u)) { if (/^https?:\/\/t\.me\//i.test(u) && tg.openTelegramLink) tg.openTelegramLink(u); else tg.openLink(u); return; } } catch (e) {}
    try { if (/^https?:/i.test(u)) { if (!window.open(u, '_blank')) location.href = u; } else location.href = u; } catch (e) { location.href = u; }
  }
  window.AndroidBridge = {
    copy: copy,
    open: open,
    share: function (text) {
      try { if (navigator.share) { navigator.share({ text: String(text) }).catch(function () {}); return; } } catch (e) {}
      copy(text); try { alert("Matn nusxalandi. Kerakli joyga qo'ying."); } catch (e) {}
    },
    shareImage: function (b64, name) {
      var f = toFile(b64, name);
      try { if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(function () {}); return; } } catch (e) {}
      download(f);
    },
    saveBackup: function (t) { try { localStorage.setItem('hk_web_backup', String(t)); } catch (e) {} },
    readBackup: function () { try { return localStorage.getItem('hk_web_backup') || ''; } catch (e) { return ''; } },
    bg: function (hex) {
      try {
        var m = document.querySelector('meta[name=theme-color]');
        if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
        m.content = hex; if (tg && tg.setHeaderColor) { tg.setHeaderColor(hex); tg.setBackgroundColor(hex); }
      } catch (e) {}
    }
    // sendTg va pinShortcut ataylab yo'q: ilova o'zining veb-yo'lini ishlatadi
  };
  try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}

  /* Telegram ichida (Mini App) Telegram keshni tozalasa, telefondagi kirish ham o'chib, ma'lumot "yo'qolgandek" ko'rinardi.
     Endi kirish (hk_lic) va bulut kaliti Telegramning o'z bulutida (CloudStorage) ham saqlanadi va kerak bo'lsa o'zi qaytadi. */
  var CS = tg && tg.initData && tg.CloudStorage;
  if (CS) {
    var ls = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; };
    window.HK_ONCLEAR = function () { try { CS.removeItems(['hk_lic', 'hk_cloud']); } catch (e) {} };
    if (!ls('hk_lic')) {
      window.HK_HOLD = 1; document.documentElement.style.visibility = 'hidden';
      var done = false, fin = function () {
        if (done) return; done = true; window.HK_HOLD = 0; document.documentElement.style.visibility = '';
        var l = null; try { l = JSON.parse(ls('hk_lic') || 'null'); } catch (e) {}
        if (!(l && l.ok && l.until > Date.now()) && !/(gate|murojaat)\.html$/.test(location.pathname)) location.replace('gate.html');
      };
      try {
        CS.getItems(['hk_lic', 'hk_cloud'], function (err, v) {
          try {
            if (!err && v && v.hk_lic) {
              ls('hk_lic', v.hk_lic);
              if (v.hk_cloud && !ls('cloud_v1')) { var c = JSON.parse(v.hk_cloud); c.exp = 0; c.lastUpd = 0; c.lastRemote = 0; ls('cloud_v1', JSON.stringify(c)); }
              done = true; location.reload(); return;
            }
          } catch (e) {}
          fin();
        });
      } catch (e) { fin(); }
      setTimeout(fin, 5000);
    }
    var last = '';
    var put = function () {
      try {
        var l = ls('hk_lic') || '', c = JSON.parse(ls('cloud_v1') || 'null');
        var cc = c && c.uid && c.rt ? JSON.stringify({ cfg: c.cfg, phone: c.phone, uid: c.uid, rt: c.rt }) : '';
        var k = l + '|' + cc; if (!l || k === last) return; last = k;
        CS.setItem('hk_lic', l); if (cc) CS.setItem('hk_cloud', cc);
      } catch (e) {}
    };
    setTimeout(put, 4000); setInterval(put, 30000);
    document.addEventListener('visibilitychange', function () { if (document.hidden) put(); });
  }
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Shogird</title>

<style>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var L=HK.lic()||{},U=L.usta||{},tab='o';
var KEY='sg_v1',D={o:[],e:[],p:{rate:0,pays:[]},until:0,un:U.name||'',dirty:false,at:0};
try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function saveD(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fm(n){return Math.round(+n||0).toLocaleString('ru-RU').replace(/ /g,' ')+" so'm"}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}

/* ---- Bulut ---- */
var C=null;try{C=JSON.parse(localStorage.getItem('cloud_v1')||'null')}catch(e){}
var BASE='https://firestore.googleapis.com/v1/projects/'+((C&&C.cfg&&C.cfg.projectId)||'elektrik-hisob')+'/databases/(default)/documents/crew/'+U.uid;
function jf(u,o){return fetch(u,o).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error((j.error&&j.error.status)||('HTTP '+r.status));e.code=r.status;throw e}return j})})}
function tok(){if(!C)return Promise.reject(new Error('kirish'));if(Date.now()<C.exp-60000)return Promise.resolve(C.idt);
  return jf('https://securetoken.googleapis.com/v1/token?key='+C.cfg.apiKey,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(C.rt)}).then(function(j){C.idt=j.id_token;C.rt=j.refresh_token||C.rt;C.exp=Date.now()+(+j.expires_in||3600)*1000;try{localStorage.setItem('cloud_v1',JSON.stringify(C))}catch(e){}return C.idt})}
var busy=false;
function sync(){if(busy||!C||!U.uid)return Promise.resolve();busy=true;
  return tok().then(function(t){var H={headers:{Authorization:'Bearer '+t}};
    var push=D.dirty?jf(BASE+'/log/'+C.uid+'?updateMask.fieldPaths=e',{method:'PATCH',headers:{'content-type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({fields:{e:{stringValue:JSON.stringify(D.e)}}})}).then(function(){D.dirty=false}):Promise.resolve();
    return push.then(function(){return Promise.all([
      jf(BASE,H).then(function(j){var f=j.fields||{};try{D.o=JSON.parse((f.o||{}).stringValue||'[]')}catch(e){}D.until=+((f.until||{}).integerValue||0);D.un=(f.un||{}).stringValue||D.un}),
      jf(BASE+'/pay/'+C.uid,H).then(function(j){try{D.p=JSON.parse(((j.fields||{}).p||{}).stringValue||'{}')}catch(e){}}).catch(function(e){if(e.code!==404)throw e}),
      D.dirty?null:jf(BASE+'/log/'+C.uid,H).then(function(j){try{D.e=JSON.parse(((j.fields||{}).e||{}).stringValue||'[]')}catch(e){}}).catch(function(e){if(e.code!==404)throw e})])})
  }).then(function(){D.at=Date.now();saveD();$('note').hidden=true;render()}).catch(function(e){
    var m=/PERMISSION|403/.test(e.message)?'Ustangiz sizni jamoadan chiqargan yoki ruxsat yo\'q.':'Internet yo\'q. Yozganlaringiz telefonda saqlanadi va internet kelganda yuboriladi.';
    $('note').textContent=m;$('note').hidden=false;render()}).then(function(){busy=false})}
/* ---- Ko'rinishlar ---- */
function locked(){return D.until&&D.until<Date.now()}
function objName(id,on){var o=D.o.filter(function(x){return x.id===id})[0];return o?o.name:(on||'—')}
function stats(){var rate=+(D.p&&D.p.rate)||0,days=0,by={};D.e.forEach(function(e){days+=+e.days||0;var k=objName(e.oid,e.on);by[k]=(by[k]||0)+(+e.days||0)});
  var paid=(D.p&&D.p.pays||[]).reduce(function(a,p){return a+(+p.a||0)},0);return{rate:rate,days:days,earned:days*rate,paid:paid,left:days*rate-paid,by:by}}
function render(){
  $('hi').textContent='👷 '+((D.p&&D.p.name)||'Shogird');$('who').textContent='Usta: '+(D.un||U.name||'')+' · +'+(L.phone||'');

  else{$('app').innerHTML='<div class="card"><div class="row"><span>Telefon</span><b>+'+esc(L.phone||'')+'</b></div><div class="row"><span>Usta</span><b>'+esc(D.un||U.name||'')+'</b></div><div class="row"><span>Oxirgi yangilanish</span><span>'+(D.at?new Date(D.at).toLocaleTimeString('ru-RU'):'—')+'</span></div></div><button class="go" id="rf">🔄 Yangilash</button><button class="lnk" id="out" style="color:var(--bad)">Ilovadan chiqish</button>';
    $('rf').onclick=function(){sync().then(function(){toast('Yangilandi')})};

}
function addDay(o){var dd=$('dlg'),n='1';
  dd.innerHTML='<h3 style="margin:0 0 4px">🏗 '+esc(o.name)+'</h3><div class="sub" style="margin:0">Shu obyektda ishladim</div><label for="dt">Sana</label><input id="dt" type="date" value="'+today()+'"><label>Necha kun</label><div class="days">'+['0.5','1','1.5','2'].map(function(x){return '<button data-n="'+x+'"'+(x===n?' class="on"':'')+'>'+x+'</button>'}).join('')+'</div><button class="go" id="ok">✅ Yozish</button><button class="lnk" id="no">Bekor</button>';
  dd.showModal();dd.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){n=b.dataset.n;dd.querySelectorAll('[data-n]').forEach(function(x){x.className=x===b?'on':''})}});
  $('no').onclick=function(){dd.close()};

document.addEventListener('click',function(e){var t=e.target.closest('[data-o],[data-d]');if(!t)return;
  if(t.dataset.o){var o=D.o.filter(function(x){return x.id===t.dataset.o})[0];if(o)addDay(o)}
  else if(t.dataset.d){if(!confirm('Bu yozuvni o\'chirasizmi?'))return;D.e=D.e.filter(function(x){return x.id!==t.dataset.d});D.dirty=true;saveD();render();sync()}});
$('tO').onclick=function(){tab='o';render()};$('tM').onclick=function(){tab='m';render()};$('tS').onclick=function(){tab='s';render()};
if(L.role!=='shogird'){location.replace('index.html');return}
render();sync();
setInterval(function(){if(!document.hidden)sync()},120000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
})();
</script>
<script>if("serviceWorker"in navigator&&(location.protocol=="https:"||location.hostname=="localhost"))window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script><script>window.YAPP="hk";</script><script>/* Yordam: o'ng tepada doimiy sozlamalar va ? tugmasi; ? har bir ekrandagi joylarni birma-bir ko'rsatib tushuntiradi.
