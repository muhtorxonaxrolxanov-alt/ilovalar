(function () {

  var tg = window.Telegram && window.Telegram.WebApp;
  function toFile(b64, name, type) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new File([u], name || 'rasm.png', { type: type || 'image/png' });
  }

    var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;

  }

    try { if (navigator.clipboard) { navigator.clipboard.writeText(String(t)); return; } } catch (e) {}
    try { var x = document.createElement('textarea'); x.value = String(t); document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); } catch (e) {}
  }
  function open(u) {
    try { if (tg && /^https?:/i.test(u)) { if (/^https?:\/\/t\.me\//i.test(u) && tg.openTelegramLink) tg.openTelegramLink(u); else tg.openLink(u); return; } } catch (e) {}
    try { if (/^https?:/i.test(u)) { if (!window.open(u, '_blank')) location.href = u; } else location.href = u; } catch (e) { location.href = u; }
  }

    copy: copy,
    open: open,
    share: function (text) {
      try { if (navigator.share) { navigator.share({ text: String(text) }).catch(function () {}); return; } } catch (e) {}
      copy(text); try { alert("Matn nusxalandi. Kerakli joyga qo'ying."); } catch (e) {}
    },
    shareImage: function (b64, name) {
      var f = toFile(b64, name);
      try { if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(function () {}); return; } } catch (e) {}
      download(f);
    },
    saveBackup: function (t) { try { localStorage.setItem('hk_web_backup', String(t)); } catch (e) {} },
    readBackup: function () { try { return localStorage.getItem('hk_web_backup') || ''; } catch (e) { return ''; } },

  };

            }
          } catch (e) {}
          fin();
        });

      setTimeout(fin, 5000);
    }

        var l = ls('hk_lic') || '', c = JSON.parse(ls('cloud_v1') || 'null');

      { x: 'Do\'konlar joylashuvi', h: '📍 Do\'konlar joylashuvi', d: 'Sozlamalar → «📍 Do\'konlar joylashuvi»: hamma do\'kon bitta ro\'yxatda (Olma va boshqalar). ✅ — lokatsiyasi bor, ⚪ — yo\'q (ular tepada turadi). Do\'konni bossangiz, kiritish joyi ochiladi: xarita havolasi, «41.31, 69.24» yoki manzil yozasiz, yoki do\'konda turib «📌 Shu yerdaman» bosasiz — darhol saqlanadi va ikkinchi telefonga ham boradi. 🗑 — kiritganingizni o\'chiradi. Tepada qidiruv bor.' },
      { x: 'Olma tarqatish tartibi', h: '🚚 Olma tarqatish tartibi', d: 'Non qaysi do\'konga qaysi navbatda tarqatilishi: 1-bo\'lim, 2-bo\'lim va hokazo — har biri alohida guruh. Sozlamalar → «🚚 Olma tarqatish tartibi». Do\'konning raqamini tanlasangiz yoki ▲▼ bossangiz, o\'rni o\'zgaradi; o\'ngdagi ro\'yxatdan boshqa borishga o\'tkaziladi; «➕ Yangi borish» — yangi guruh; nomini ustiga yozib o\'zgartirasiz; 🗑 — guruhni o\'chiradi (do\'konlari «Boshqalar»ga o\'tadi). O\'zgarish darhol saqlanadi va ikkinchi rahbar telefonida ham ko\'rinadi. Olma ro\'yxati va «🚗 Ketdikmi?» shu tartibda chiqadi. ✓ bosilsa, do\'kon o\'z joyida «✅ berildi» bo\'ladi, ekran siljimaydi.' },
      { sel: '#go_btn', h: '🚗 Joylashuv bo\'yicha ketdikmi?', d: 'Olma ro\'yxatining eng pastida. Bossangiz 1-bo\'lim yoki 2-bo\'lim tanlanadi. Bo\'limni bossangiz, Yandex Xarita ilovasi darhol ochiladi: berilmagan do\'konlar ketma-ket belgilangan bo\'ladi. Tanlangan guruhning non BERILMAGAN do\'konlari Yandex xaritasida siz turgan joydan boshlab, siz belgilagan tartibda ketma-ket ko\'rinadi, pastida ro\'yxati turadi. Tepada katta qilib hozir boradigan do\'kon raqami, nomi va qancha non kerakligi turadi (Yandexdagi raqam bilan bir xil). «▶️ Yandex\'da yo\'lni boshlash» — Yandex ilovasi hamma do\'kon bilan ochiladi; uning ustida kichik oyna turadi: do\'kon, non soni va «✓ Berildi» (bossangiz keyingisi chiqadi; barmoq bilan surib joyini o\'zgartirasiz, matnini bossangiz ilovaga qaytadi, ✕ — yopadi). Buning uchun yangi ilova (4.2) va «🪟 Boshqa ilova ustida» ruxsati kerak (Sozlamalar → 🔐 Ruxsatlar). Do\'konga non tashlagach ✓ bosasiz: do\'kon xaritadan va ro\'yxatdan chiqadi, qizil belgi keyingisiga o\'tadi. Qatorning 📍 belgisi — faqat shu do\'konning o\'z yo\'li; 📌 — nuqtasi yo\'q, bosib belgilaysiz. Tartib Sozlamalar → «🚚 Olma tarqatish tartibi»da o\'zgaradi.' },
      { sel: '#pk_ok', h: '📌 Joyni belgilash', d: '«📌 Shu yerdaman» bosilganda Telegramdagidek xarita ochiladi: ko\'k nuqta — siz turgan joy, o\'rtadagi 📍 — belgilanadigan joy. Xaritani surib, 📍 uchini do\'kon ustiga keltiring va «✅ Shu joyni belgilash»ni bosing. 🎯 — o\'zingiz turgan joyga qaytaradi.' },
      { sel: '#nv_box', h: '🚗 Ilova ichida yo\'l', d: 'Do\'kon yonidagi 📍 bosilsa, faqat shu do\'konga yo\'l ochiladi — boshqa ilova kerak emas. Ko\'k chiziq — ko\'chalar bo\'ylab marshrut (o\'tilgan qismi kulrang), qizil mashina — siz, yurganingizda o\'zi yuradi. Tepada keyingi burilish, qolgan masofa va vaqt. Yo\'ldan chiqsangiz, marshrut qayta quriladi. Yetib borganda «🏁 Yetib keldingiz!» va «✓ Berildi» tugmasi chiqadi: bossangiz, non berilgan bo\'ladi. GPS adashsa «🏁 Yetib keldim»ni o\'zingiz bosasiz. «🎯 Men» — xarita sizga qaytadi, «🗺 Butun yo\'l» — hammasi ko\'rinadi, ✏️ — joylashuvni o\'zgartirish. Yo\'l chizish uchun internet kerak.' },
      { sel: '#dk_tg', h: '📞 Do\'kon telefoni', d: 'Har bir do\'kon oynasida, «Hammasini saqlash» tugmasi ustida. Raqamni yozasiz (masalan 90 123 45 67) — u botga yuboriladi. Keyin «✈️ Ulanish havolasini yuborish»ni bosib, do\'konchiga havolani jo\'nating: do\'konchi havolani ochib START, so\'ng «Raqamni ulashish»ni bir marta bosadi (Telegram qoidasi: bot birinchi yoza olmaydi). Shundan keyin non NASIYAGA berilganda do\'konchiga Telegramdan darhol xabar boradi: qaysi non nechta, jami summa va umumiy qarzi. Naqd yoki karta bilan to\'liq to\'langanda xabar bormaydi. ✅ — ulangan, ⏳ — hali ulanmagan, 🔕 — do\'konchi o\'chirib qo\'ygan.' },
      { x: 'Kun oxiri vaqti', h: '⏰ Kun oxiri vaqti', d: 'Xohlagan vaqtni qo\'ying: soat va daqiqa (masalan 21:35). Ilova ochiq turganda shu vaqtda kun oxiri eslatmasi chiqadi.' },
      { x: 'Tushirib qo\'yildi', h: '📥 Mashinadan tushirib qo\'yildi', d: 'Mashinadagi non nonvoyxonaga tushirilganda yozasiz: 1) qaysi nonvoyxonaga tushirildi; 2) non turi; 3) soni (faqat raqam). Tugmani bossangiz, o\'sha son «Mashinada»dan ayriladi va tepadagi «📥 Tushirilgan» ichida qaysi nonvoyxonaga tushirilgani vaqti bilan turadi. Mashinadagidan ko\'p yozsangiz, ilova avval so\'raydi. Xato bo\'lsa 🗑 bosing — non mashinaga qaytadi.' },
      { x: 'Kassa', h: '💵 Kassa', d: 'Kun davomida kassadan olingan pullarni yozasiz. Kechqurun ilova kassa to\'g\'ri, kam yoki ortiqchaligini o\'zi hisoblaydi. Tepadagi kichik tugmalar: 💸 Olingan — har bir olingan pul va uni bekor qilish; 🧮 Hisob — kassada qancha bo‘lishi kerak; 📅 Kunlar — oxirgi 30 kun; 🏭 Filial — qaysi nonvoyxona.' },
      { x: 'Hodimlar', h: '👷 Hodimlar', d: 'Hodimlar ro\'yxati. Ismini bossangiz — lavozimi, haqi (qop / kunlik / oylik), topgani, olgani, qolgani va davomati chiqadi; shu yerda 💵 Pul berish, ✏️ Tahrirlash, 📋 Davomat yozish, O\'chirish.' },
      { sel: '#hd_add', h: '➕ Hodim qo\'shish', d: 'Ismi, lavozimi, nonvoyxonasi va haqini qanday olishi (🥣 Qopiga, 📅 Kunlik, 🗓 Oylik — bir nechtasini ham tanlash mumkin). Oylikda ertalab keladigan va kechqurun ketadigan vaqti yoziladi: kech kelsa yoki erta ketsa, kam ishlagan daqiqasi oyligidan o\'zi ayriladi (faqat rahbarda ko\'rinadi). Kirish kodi — hodim Sizning raqamingiz va shu kod bilan kiradi.' },
      { sel: '#om_bx', h: '📦 Ombordagi mahsulotlar', d: 'Har mahsulotning hozirgi qoldig\'i. Mahsulotni bossangiz — kun va soat bo\'yicha hamma tushirilganlari, kim tushirgani chiqadi. Kirimni bosib sonini to\'g\'rilash yoki o\'chirish, «✏️ Mahsulotni tahrirlash» bilan qoldiqni o\'zgartirish yoki mahsulotni o\'chirish mumkin. Hodim o\'chira olmaydi.' },
      { x: 'Ma\'lumotlarni tahrirlash', h: '✏️ Ma\'lumotlarni tahrirlash', d: 'Har bo\'lim alohida. 🏪 Do\'konlar → do\'konni bosing → soat bo\'yicha berilgan non, qaytgan non va olingan pul chiqadi → qatorni bosib sonini, summasini o\'zgartirasiz yoki o\'chirasiz. Olingan pul kamaytirilsa, farqi yana qarzga qaytadi. 📦 Ombor ham shu yerda.' },
      { x: 'Xarajat', h: '🧾 Xarajat', d: 'Kunlik xarajatlar: un, gaz, svet va boshqalar. Hisobotda foydadan ayriladi.' },
      { x: 'Non turlari', h: '🍞 Non turlari', d: 'Qanday nonlar yopilishi, narxi va retsepti (1 qop un uchun nima kerak).' },
      { x: 'Hisobot', h: '📊 Hisobot', d: 'Kun, hafta, oy bo\'yicha jami: berilgan non, olingan pul, nasiya, xarajat va foyda.' },
      { sel: '.pxl', h: '🎬 Jonli sahna', d: 'Nonvoyxonaning bugungi holati: omborga nima kirdi, hamirchi necha qop qildi, tandirda necha non yopildi, do\'konlarga qancha ketdi. Hodimlar yozgan zahoti shu yer o\'zgaradi.' },
      { sel: '#fab', h: '🎤 Ovozli yordamchi', d: 'Bosing va gapiring: «Anorga 15 ta patir berildi». Yordamchi nima qilishini ko\'rsatadi, «Ha» desangiz bajaradi.' },
      { sel: '#gear', h: '⚙ Sozlamalar', d: 'Nonvoyxona nomi, bildirishnomalar, ko\'rinish va boshqa sozlamalar.' }] },
    /* ---------- Nonvoyxona: hodim ---------- */
    th: { t: '🥖 Nonvoyxona — hodim', i: 'Hodim ilovasi: hamirchi, yopuvchi yoki sotuvchi ishini yozadi. Yozganlaringiz rahbarga o\'zi boradi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '#ph', h: '📱 Rahbar raqami', d: 'Birinchi marta: rahbaringizning telefon raqamini yozing (o\'zingiznikini emas).' },
      { sel: '#cd2', h: '🔑 Kod', d: 'Rahbar Sizga bergan shaxsiy kodni yozing va «Kirish» ni bosing.' },
      { x: 'Hamir', h: '🥣 Hamir', d: 'Hamirchi: nechta qop hamir qilganingizni yozasiz. Vazifa bajarilsa salyut chiqadi.' },
      { x: 'tandir', h: '🔥 Tandirlar', d: 'Yopuvchi: har tandirda nechta non yopilganini yozasiz (1-tandir, 2-tandir…).' },
      { sel: '#om_new', h: '➕ Yangi mahsulot qo‘shish', d: 'Omborda yo‘q mahsulotni qo‘shadi. Bosilsa oyna ochiladi: nomi, birligi (kg, litr, dona) va hozirgi miqdori (raqam), keyin «Qo‘shish».' },
      { x: 'Davomat', h: '📋 Davomat', d: 'Faqat oylik ishlaydigan hodimlar. Ismini bosib, kelgan va ketgan vaqtini yozasiz (🕒 Hozir — hozirgi vaqtni qo\'yadi) yoki «❌ Kelmadi». O\'tgan kun uchun sanani almashtiring.' },
      { x: 'Yuborish', h: '📤 Yuborish', d: 'Internet bo\'lmasa yozuvlar telefonda saqlanadi. Internet kelganda o\'zi yoki shu tugma bilan rahbarga ketadi.' }] },
    /* ---------- Hisob-kitob ---------- */
    'hk-i': { t: '⚡ Hisob-kitob', i: 'Usta uchun: obyektlar, qilingan ishlar, olingan pul, shogirtlar va hisobot. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { x: 'Shit sxemasi', h: '📐 Shit sxemasi', d: 'Shitni haqiqiy avtomatlar bilan yig\'ib, narxini hisoblaydi.' },
      { x: 'Santexnika', h: '🚿 Santexnika sxemasi', d: 'Qozonxona, kollektor va quvurlar bilan sxema va narx.' },
      { x: 'Hisob-kitob', h: '🧾 Hisob-kitob', d: 'Asosiy bo\'lim: obyektlar, ishlar, pullar, shogirtlar.' },
      { sel: '#payb', h: '💳 To\'lov', d: 'Obunani uzaytirish: tarifni tanlab, kartaga o\'tkazasiz va chek rasmini yuborasiz.' },
      { sel: '#prof', h: '👤 Profil', d: 'Sohangiz, parolni o\'zgartirish va ilovadan chiqish.' }] },
    'hk-h': { t: '🧾 Hisob-kitob', i: 'Obyektlar, shogirtlar va hisobot. Hamma yozuv bulutga o\'zi saqlanadi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '#hkm', h: '🎤 Ovoz bilan yozish', d: 'O’ng pastdagi qizil 🎤. Avval yozmoqchi bo’lgan maydonni bosing, keyin 🎤 ni bosib gapiring, tugatgach yana bosing — gap shu maydonga yoziladi (raqam maydoniga faqat son). Birinchi marta «Mikrofonga ruxsat berasizmi?» chiqadi — «Ruxsat berish» ni bosing.' },
      { sel: '#t1', h: '🏗 Obyektlar', d: 'Ish qilayotgan joylaringiz. Obyektni bossangiz: qilingan ishlar va olingan pullar.' },
      { sel: '#oq', h: '🔍 Qidiruv', d: 'Obyektni nomi, mijoz ismi yoki raqami bo\'yicha tez topish.' },
      { sel: '#addBtn', h: '➕ Qo\'shish', d: 'Yangi obyekt (yoki Shogirtlar bo\'limida — yangi shogird) qo\'shish.' },
      { sel: '[data-a="additem"]', h: '➕ Ish / tochka', d: 'Qilingan ish: nima ish, nechta, bittasi necha pul.' },
      { sel: '[data-a="addrecv"]', h: '💵 Olingan pul', d: 'Mijozdan olingan pulni yozasiz. Keyin mijozga chek yuborish taklif qilinadi.' },
      { sel: '#t4', h: '💸 Xarajatlar', d: 'Rasxodlaringizni yozib borasiz. Obyektni (yoki «📦 Umumiy») bosing, turini tanlang — 🧱 Material, 🚕 Yo’l, 🍽 Ovqat, 🔧 Asbob, 👷 Usta, 📦 Boshqa — summani yozib «Saqlash». Xarajat obyekt sahifasida, Hisobotda va «O’zimga qolgan»da hisoblanadi. Mijozga ko’rsatiladigan hisobda chiqmaydi.' },
      { sel: '.bzbig', h: '🛒 Bozordan olingan tovarlar', d: 'Bozordan material olsangiz shu yerga yozasiz. Bosing → «📷 Rasmga olish» (chek, nakladnoy yoki qo‘lda yozilgan qog‘oz) — sun’iy intellekt rasmni o‘qib, har bir tovarni nomi, soni va 1 dona narxi bilan ro‘yxat qiladi, summani o‘zi hisoblaydi (10–30 soniya). «🖼 Rasm tanlash» — galereyadagi rasm (bir nechtasini birdan tanlasa bo‘ladi). «✍️ Matndan» — har qatorga bitta tovar yozasiz, masalan «rozetka 5 ta 25 ming». Ro‘yxatni tekshiring: noto‘g‘ri bo‘lsa katakni bosib to‘g‘rilang, «✕» — qatorni o‘chirish, «+ Qator qo‘shish» — qo‘lda qo‘shish. Narxi yozilmagan tovar qizil ramkada. Oxirida «✓ Saqlash».' },
      { sel: '.bzmz', h: '🏠 Mijoz to‘laydi', d: 'Belgi qo‘yilgan bo‘lsa (odatda shunday), bozor ro‘yxati uy egasiga yuboriladigan hisobda («Mijozga ko‘rsatish», rasm va matn) alohida «🛒 Bozordan olingan tovarlar» bo‘limi bo‘lib chiqadi: har bir tovar, soni, narxi va «Bozor jami». Bu summa «Jami narx» va «Qolgan pul»ga qo‘shiladi. Belgini olib tashlasangiz — faqat o‘zingizning xarajatingiz bo‘lib qoladi.' },
      { sel: '[data-ecat]', h: '⚡ Tez yozish', d: 'Turini bosing — oyna o’sha tur bilan ochiladi, faqat summani yozasiz. Noto’g’ri yozilganini ✕ bilan o’chirasiz.' },
      { sel: '#t2', h: '👷 Shogirtlar', d: 'Shogirtlar: kunlik haqi, ishlagan kunlari, berilgan pul va qarz. «📤 Ilovaga taklif» bilan shogirdga havola yuborasiz.' },
      { sel: '[data-cinv]', h: '📤 Ilovaga taklif', d: 'Shogirdga havola yuboradi. U havolani ochib, parol qo\'yadi va obyektlaringizda «ishladim» deb yoza oladi.' },
      { sel: '#t3', h: '📊 Hisobot', d: 'Jami olingan pul, mijozlardan qolgan qarz, shogirtlarga berilgan pul va qarz, obyektlar bo\'yicha shogirdlar.' },
      { sel: '[data-a="gear"]', h: '⚙ Sozlamalar', d: 'Profil, ilova nomi va belgisi, ko\'rinish, zaxira nusxa.' }] },
    'hk-sg': { t: '👷 Shogird', i: 'Ustangizning obyektlarida ishlagan kunlaringizni yozasiz. Ustangiz ham ko\'radi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '.obj', h: '🏗 Obyekt', d: 'Qaysi obyektda ishlagan bo\'lsangiz, shuni bosing → necha kun → «Yozish».' },
      { sel: '#tM', h: '💰 Hisobim', d: 'Kunlik haqingiz, ishlagan kunlaringiz, olgan va olishingiz kerak bo\'lgan pul.' },

    gate: { t: '🔐 Kirish', i: 'Birinchi marta «Ro\'yxatdan o\'tish», keyingi safar «Kirish» (raqam va parol). ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [

    es: { t: '🧾 Do\'kon Sotuvchi', i: 'Buyurtmalarni qabul qilish, yetkazish, mijozlar, tovarlar va hisobot. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
