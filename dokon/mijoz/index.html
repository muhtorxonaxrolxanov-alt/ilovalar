<!doctype html>
<html lang="uz">
<head><meta name="theme-color" content="#F2A900"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elektr Do'kon"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2A900">
<title>Elektr Do'kon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<style>

/* Layout: one-column phone shell, sticky header, bottom tab bar; cards only for orders and products */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#E9EDF2; --fg:#111B25; --muted:#5A6878; --line:#D8DEE6;
  --accent:#F2A900; --on-accent:#1C1400; --wire:#1D57B5; --ok:#17804A; --warn:#B9520E; --bad:#C2302F;
  --ok-bg:#E3F4EA; --warn-bg:#FDEEDF; --bad-bg:#FBE6E5; --wire-bg:#E4ECFA;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(17,27,37,.06),0 4px 14px rgba(17,27,37,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#151E28; --surface2:#1E2935; --fg:#E7EDF3; --muted:#91A0B0; --line:#293644;
  --accent:#FFB81C; --on-accent:#1C1400; --wire:#79A7F2; --ok:#45C47F; --warn:#F09A55; --bad:#F27270;
  --ok-bg:#17301F; --warn-bg:#35230F; --bad-bg:#3A1818; --wire-bg:#18273D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#151E28; --surface2:#1E2935; --fg:#E7EDF3; --muted:#91A0B0; --line:#293644;
  --accent:#FFB81C; --on-accent:#1C1400; --wire:#79A7F2; --ok:#45C47F; --warn:#F09A55; --bad:#F27270;
  --ok-bg:#17301F; --warn-bg:#35230F; --bad-bg:#3A1818; --wire-bg:#18273D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wire);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.logo{overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.hero{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.hero>img,.hero-empty{display:block;width:100%;max-width:100%;aspect-ratio:16/7;object-fit:cover}
.hero-empty{display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-size:13px}
.hero .cap{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hero .cap b{font-family:var(--display);font-size:16px}
.bannerpick{width:100%;max-width:100%;aspect-ratio:16/7;border-radius:10px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:13px;border:1px dashed var(--line)}
.bannerpick img{width:100%;height:100%;object-fit:cover;display:block}
.brand-t{min-width:0}
.brand-t b{display:block;font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{font-size:12px;color:var(--muted)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}



.net{background:var(--warn-bg);border-top:1px solid var(--line)}
.net.ok{background:var(--wire-bg)}
.net .wrap{padding-block:8px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.net svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.p-pend{background:var(--warn-bg);color:var(--warn)}

/* search */
.search{padding-block:10px 0}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px;background-image:none}
.search{position:relative}
.search svg{position:absolute;left:max(28px,calc(env(safe-area-inset-left,0px) + 12px));top:22px;width:18px;height:18px;color:var(--muted);pointer-events:none}

main{padding-block:14px 150px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{opacity:.65;margin-left:4px}

.btn{height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;flex:none}

.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.p-new{background:var(--bad-bg);color:var(--bad)}
.p-accepted{background:var(--wire-bg);color:var(--wire)}
.p-onway{background:var(--warn-bg);color:var(--warn)}
.p-delivered{background:var(--ok-bg);color:var(--ok)}
.p-cancelled{background:var(--surface2);color:var(--muted)}
.p-gray{background:var(--surface2);color:var(--muted)}
.debt{color:var(--bad);font-weight:700}
.okc{color:var(--ok);font-weight:700}

/* catalog */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;max-width:100%;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .ini{font-family:var(--display);font-size:22px;color:var(--muted)}
.prod .b{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .n{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.prod .pr{font-weight:700;font-size:15px}
.prod .pr.hid{font-weight:500;font-size:13px;color:var(--muted)}
.prod .foot{margin-top:auto;padding-top:6px}
.step{display:flex;align-items:center;justify-content:space-between;height:38px;border-radius:10px;background:var(--surface2);overflow:hidden}
.step button{width:42px;height:38px;border:0;background:transparent;font-size:20px;font-weight:600}
.step .q{font-weight:700}
.add{width:100%;height:38px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.add:disabled{background:var(--surface2);color:var(--muted)}

/* cart bar + nav */
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding-block:8px}
.cartbar .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cartbar button{width:100%;height:54px;border-radius:14px;border:0;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;box-shadow:var(--shadow)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{position:relative;height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--fg)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .dot{top:6px;right:calc(50% - 22px)}

/* order card */
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.order.is-new{border-color:var(--bad)}
.oh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px 14px 8px}
.oh .code{font-family:var(--display);font-size:14px}
.ob{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;font-size:14px;align-items:start}
.kv svg{width:16px;height:16px;color:var(--muted);margin-top:2px}
.items{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:6px}
.it{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.it input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.it .nm{flex:1;min-width:0}
.it.done .nm{text-decoration:line-through;color:var(--muted)}
.it .qq{font-weight:700;white-space:nowrap}
.oa{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface2)}
.oa .btn{flex:1;min-width:120px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.hero{grid-column:1/-1;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kpi.hero .lbl{color:var(--bg);opacity:.7}
.kpi.hero .v{font-family:var(--display);font-size:26px}
.kpi.hero .v.neg{color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;padding-top:8px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar .s{width:100%;display:flex;gap:2px;align-items:flex-end;height:120px}
.bar .s i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.bar .s i.a{background:var(--surface2);border:1px solid var(--line)}
.bar .s i.b{background:var(--accent)}
.bar .s i.b.neg{background:var(--bad)}
.bar span{font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{white-space:nowrap;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal}
.scroll{overflow-x:auto}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:18px;max-height:88%}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 13px;width:100%}
.f textarea{height:auto;min-height:72px;padding:11px 13px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-align:center;padding:6px}
.seg label small{font-weight:400;font-size:11.5px;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:14px;background:var(--surface2);border:1px solid var(--line);transition:.15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.sw input:checked+span{background:var(--ok);border-color:var(--ok)}
.sw input:checked+span::after{left:23px;background:#fff}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .ph{width:84px;height:84px;aspect-ratio:auto;border-radius:10px;flex:none}

.empty{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:42px;height:42px;opacity:.6}
.empty b{color:var(--fg);font-size:16px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--wire-bg);color:var(--fg)}
.note.warn{background:var(--warn-bg)}

.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:30px}
.login h1{font-size:28px;line-height:1.15}
.gbtn{background:var(--surface);border:1px solid var(--line)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--wire);font-weight:600;padding:4px 0}
.back svg{width:18px;height:18px}
.hist .li{align-items:flex-start}
.ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:700;font-size:15px}
.ic.sale{background:var(--bad-bg);color:var(--bad)} .ic.pay{background:var(--ok-bg);color:var(--ok)} .ic.debt{background:var(--warn-bg);color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.toast{animation:pop .18s ease-out}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{position:relative}.ph img{position:absolute;inset:0}
.logo{position:relative}.logo img{position:absolute;inset:0}
.hero .cap b{font-family:var(--display);font-size:16px}
a.btn{text-decoration:none;color:var(--fg)}
/* ---- v1.1 ---- */
.search{position:relative;z-index:12}
.sugg{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:56px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(17,27,37,.16);padding:6px;max-height:60vh;overflow:auto;z-index:25}
.sg-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 8px 6px}
.sg-h svg{width:15px;height:15px;color:var(--accent)}
.sg-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 8px}
.sg-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 10px;border-radius:10px;font-size:15px}
.sg-i:active,.sg-i:hover{background:var(--surface2)}
.sg-i svg{width:16px;height:16px;color:var(--muted);flex:none}
.sg-i b{color:var(--fg);background:rgba(242,169,0,.28);border-radius:3px}
.prod .tap{cursor:pointer}
.badge{position:absolute;top:8px;left:8px;background:var(--bad);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:8px;z-index:2}
.ph .more{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;z-index:2}
.old{color:var(--muted);text-decoration:line-through;font-weight:500;font-size:13px;margin-left:6px}
/* karusel */
.car{position:relative;border-radius:16px;overflow:hidden;background:var(--fg)}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.car-track::-webkit-scrollbar{display:none}
.car-s{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:16/10;max-width:100%;cursor:pointer;overflow:hidden}
.car-s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.car-s .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:44px;color:rgba(255,255,255,.25)}
.car-s .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 30px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;display:flex;flex-direction:column;gap:4px}
.car-s .cap b{font-family:var(--display);font-size:19px;line-height:1.2}
.car-s .cap .p{font-weight:700;font-size:17px}

const normQ = s => String(s || '').toLowerCase().replace(/[ʻʼ'’‘`"]/g, '').replace(/(.)\1+/g, '$1').trim();
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function matchScore(name, q) {
  const n = normQ(name), x = normQ(q);
  if (!x) return 0;
  if (n.startsWith(x)) return 100;
  const words = n.split(/[\s\-·,.()/]+/);
  if (words.some(w => w.startsWith(x))) return 80;
  if (n.includes(x)) return 60;
  if (x.length >= 4 && words.some(w => lev(w.slice(0, x.length), x) <= (x.length > 6 ? 2 : 1))) return 30;   // xato yozilsa ham topadi
  return 0;
}
const matchText = (text, q) => !q || matchScore(text, q) > 0 || String(text).toLowerCase().includes(String(q).toLowerCase());
function hlName(n, q) {
  const i = String(n).toLowerCase().indexOf(String(q).toLowerCase().trim());
  if (i < 0 || !q.trim()) return h(n);

}

function sha256(s) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b = unescape(encodeURIComponent(s)), l = b.length, w = [];
  for (let i = 0; i < l; i++) w[i >> 2] |= b.charCodeAt(i) << (24 - (i % 4) * 8);
  w[l >> 2] |= 0x80 << (24 - (l % 4) * 8); w[((l + 8) >> 6 << 4) + 15] = l * 8;
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < w.length; i += 16) {
    const W = []; let [a, bb, c, d, e, f, g, hh] = H;
    for (let t = 0; t < 64; t++) {
      W[t] = t < 16 ? (w[i + t] | 0) : (r(W[t - 2], 17) ^ r(W[t - 2], 19) ^ (W[t - 2] >>> 10)) + W[t - 7] + (r(W[t - 15], 7) ^ r(W[t - 15], 18) ^ (W[t - 15] >>> 3)) + W[t - 16] | 0;
      const t1 = hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + W[t] | 0, t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c)) | 0;
      hh = g; g = f; f = e; e = d + t1 | 0; d = c; c = bb; bb = a; a = t1 + t2 | 0;
    }
    H = H.map((x, k) => x + [a, bb, c, d, e, f, g, hh][k] | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

/* ---------- chek: matn, ESC/POS (Bluetooth printer), HTML (oddiy printer) ---------- */
const ascii = s => String(s ?? '').replace(/[ʻʼ’‘`]/g, "'").replace(/[«»“”]/g, '"').replace(/№/g, 'No').replace(/[—–]/g, '-').replace(/×/g, 'x').replace(/·/g, '-')
  .replace(/[А-яЁё]/g, c => ({'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':"'",'ы':'i','ь':'','э':'e','ю':'yu','я':'ya'}[c.toLowerCase()] || '?'))
  .replace(/[^\x20-\x7E\n]/g, '?');
function receiptLines(o, shop, balance, W) {
  W = W || 32;
  const L = [], line = (a, b) => { a = ascii(a); b = ascii(b); const sp = W - a.length - b.length; return sp >= 1 ? a + ' '.repeat(sp) + b : a + '\n' + ' '.repeat(Math.max(0, W - b.length)) + b; };
  const wrap = t => { const out = []; ascii(t).split(' ').forEach(w => { if (!out.length || (out[out.length - 1] + ' ' + w).length > W) out.push(w); else out[out.length - 1] += ' ' + w; }); return out; };
  const sum = n => fmt(n);
  L.push({c: 1, b: 1, t: shop.name || "Elektr Do'kon"});
  [shop.address, shop.phone].filter(Boolean).forEach(x => L.push({c: 1, t: x}));
  L.push({t: '-'.repeat(W)});
  L.push({t: line('Chek No ' + o.code, fday(o.at || new Date()))});
  L.push({t: 'Mijoz: ' + ascii(o.cname || '')});
  if (o.phone) L.push({t: 'Tel: ' + o.phone});
  L.push({t: '-'.repeat(W)});
  (o.items || []).forEach(it => {
    wrap(it.name).forEach(x => L.push({t: x}));
    L.push({t: line('  ' + fmt(it.qty) + ' ' + (it.unit || '') + ' x ' + sum(it.price), sum(N(it.price) * N(it.qty)))});
  });
  L.push({t: '-'.repeat(W)});
  const total = o.final != null ? o.final : (o.items || []).reduce((s, i) => s + N(i.price) * N(i.qty), 0);
  L.push({b: 1, t: line('JAMI:', sum(total) + " so'm")});
  if (o.paid != null) L.push({t: line("To'landi:", sum(o.paid) + " so'm")});
  if (o.paid != null && total - o.paid > 0) L.push({t: line('Qarzga yozildi:', sum(total - o.paid) + " so'm")});
  if (balance != null) L.push({t: line('Umumiy qarz:', sum(Math.max(0, balance)) + " so'm")});

}
function receiptText(o, shop, balance) { return receiptLines(o, shop, balance).map(x => x.t).join('\n'); }
function escpos(lines) {
  const out = [0x1B, 0x40, 0x1B, 0x74, 0x00];
  const push = s => { for (const ch of s) out.push(ch.charCodeAt(0) & 0x7F); };
  lines.forEach(l => {
    out.push(0x1B, 0x61, l.c ? 1 : 0); out.push(0x1B, 0x45, l.b ? 1 : 0);

    push(ascii(l.t)); out.push(0x0A);
    if (l.b && l.c) out.push(0x1D, 0x21, 0x00);
  });
  out.push(0x1B, 0x61, 0, 0x0A, 0x0A, 0x0A, 0x1D, 0x56, 0x42, 0x00);
  let bin = ''; out.forEach(b => bin += String.fromCharCode(b)); return btoa(bin);
}

    rows.map(r => '<pre class="' + (r.c ? 'c ' : '') + (r.b ? 'b ' : '') + (r.b && r.c ? 'big' : '') + '">' + h(r.t) + '</pre>').join('') + '</body></html>';

<script>

/* ---------- ma'lumot yuklash ---------- */
async function loadCatalog() {

}

/* ---------- telefon ekranidagi belgi (sotuvchi sozlaydi, hamma mijozda bir xil) ---------- */
const canPin = () => !!(window.Android && window.Android.pinShortcut);
function autoUpdateShortcut() {   // belgi allaqachon qo'shilgan bo'lsa, yangi rasm/nom o'zi yangilanadi

}

window.onNativeEvent = (name, val) => {

};

/* ---------- internetsiz buyurtma navbati ---------- */
let flushing = false;
async function flushQueue() {
  if (flushing || !S.token || !S.queue.length) return;
  flushing = true; drawNet();
  for (const q of S.queue.slice()) {
    if (q.error) continue;
    try {
      const r = await api('placeOrder', {items: q.items, pay: q.pay, note: q.note, clientOrderId: q.clientOrderId, receipt: q.receipt || undefined});
      S.queue = S.queue.filter(x => x.clientOrderId !== q.clientOrderId);

    } catch (e) {
      if (e.code === 'net' || e.code === 'auth' || e.code === 'busy') break;
      q.error = e.message; save('queue');

  flushing = false; drawNet(); render();
}
addEventListener('online', () => { drawNet(); flushQueue(); refreshAll(); });
addEventListener('offline', () => drawNet());
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flushQueue(); if (S.token) loadOrders(); } });
setInterval(() => { if (S.queue.some(q => !q.error)) flushQueue(); }, 20000);
function drawNet() {

const canOrder = () => S.token && (S.me || {}).active !== false;
const priceHtml = (p, cls) => showPrices() && p.price != null ? '<div class="' + (cls || 'pr') + ' num">' + som(p.price) + (p.oldPrice > p.price ? '<span class="old">' + fmt(p.oldPrice) + '</span>' : '') + '</div>' : '<div class="pr hid">Narxi kelishiladi</div>';
const stepper = (p, big) => {

};

/* ---------- chizish ---------- */
function draw() {
  const sh = S.shop || {};

}
function drawNav() {
  const n = $('#nav');
  if (!S.token) { n.hidden = true; return; }

function afterDraw() {

// aksiya karuseli o'zi aylanadi
setInterval(() => {
  const tr = $('#carTrack'); if (!tr || document.hidden || Date.now() - S.lastTouch < 6000) return;

/* ---------- kirish va ro'yxatdan o'tish ---------- */
function vAuth() {
  const sh = S.shop || {}, np = !!S.needPass;
  return '<div class="login">' + (sh.banner ? '<img src="' + h(sh.banner) + '" alt=""' + IMGERR + ' style="width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:14px">' : '') +
    '<div><div class="lbl">Elektr mollari do\'koni</div><h1 style="margin-top:8px">' + h(sh.name || "Elektr Do'kon") + '</h1><p class="muted" style="margin:8px 0 0">Buyurtmani telefondan bering, manzilingizga olib boramiz.</p></div>' +
    '<form data-form="phone" class="card pad"><div class="f"><label for="l_phone">Telefon raqamingiz</label><input id="l_phone" name="phone" type="tel" inputmode="numeric" placeholder="+998 90 123 45 67" required autocomplete="tel" style="font-size:22px;letter-spacing:1px" value="' + h(S.authPhone || lsGet('m_phone', '') || '+998 ') + '"></div>' +
    (np ? '<div class="f"><label for="l_pass">Bu raqamga avval parol qo\'yilgan — parolingiz</label><input id="l_pass" name="password" type="password" required autocomplete="current-password"></div>' : '') +
    '<button class="btn pri block" style="height:52px">Kirish</button>' +

/* ---------- do'kon ---------- */
function carouselHtml() {

function vShop() {
  if (!S.cat) return S.loaded.catErr ? '<div class="empty">' + I.wifi + '<b>Katalogni yuklab bo\'lmadi</b><span>Internetni tekshiring.</span><button class="btn pri" data-act="reload">Qayta urinish</button></div>' : loading('Katalog yuklanmoqda…');

    '<div class="grow"><div class="t" style="white-space:normal">' + h(i.p.name) + '</div><div class="s num">' + (sp && i.p.price != null ? som(i.p.price) + ' × ' + fmt(i.qty) + ' = ' + som(i.p.price * i.qty) : h(i.p.unit || 'dona')) + '</div></div>' +

    (sp ? '<div class="row between"><span class="muted">Jami</span><b class="num" style="font-size:20px">' + som(cartTotal()) + '</b></div>' : '<div class="note">Narxni sotuvchi tasdiqlaydi va yetkazganda aytadi.</div>') +
    '<div class="f"><label>To\'lov turi</label><div class="seg">' + [['naqd', 'Naqd', "qo'lga beraman"], ['nasiya', 'Nasiya', "keyin to'layman"], ['karta', 'Karta', "o'tkazma"]].map(([k, l, s]) => '<label><input type="radio" name="pay" value="' + k + '"' + (pay === k ? ' checked' : '') + '>' + l + '<small>' + s + '</small></label>').join('') + '</div></div>' +
    '<div id="cardBox"' + (pay === 'karta' ? '' : ' hidden') + '>' + cardBoxHtml(sh, sp ? cartTotal() : null) +

    '<div class="small muted">Yetkazish manzili: <b style="color:var(--fg)">' + h([me.district, me.address].filter(Boolean).join(', ')) + '</b>' + (me.landmark ? ' (' + h(me.landmark) + ')' : '') + '</div>' +

function cardBoxHtml(sh, total) {

  return '<div class="cardbox"><div class="small" style="opacity:.75">Shu kartaga o\'tkazing' + (total ? ': <b>' + som(total) + '</b>' : '') + '</div><div class="no">' + h(sh.card) + '</div>' +
    '<div class="row between"><span class="small" style="opacity:.85">' + h(sh.cardOwner || '') + '</span><button type="button" class="btn sm" data-act="copyCard" style="background:#fff;color:#111">Nusxa olish</button></div></div>' +

}

/* ---------- buyurtmalarim ---------- */
function orderItems(items, sp) {
  return '<div class="items">' + (items || []).map(it => '<div class="it"><span class="nm">' + h(it.name) + '</span><span class="qq num">' + fmt(it.qty) + ' ' + h(it.unit || '') + '</span>' +
    (sp && it.price != null ? '<span class="muted small num" style="min-width:86px;text-align:right">' + som(N(it.price) * N(it.qty)) + '</span>' : '') + '</div>').join('') + '</div>';
}
function vOrders() {
  const act = S.orders.filter(o => ['new', 'accepted', 'onway'].includes(o.status)), done = S.orders.filter(o => !['new', 'accepted', 'onway'].includes(o.status));
  const q = S.queue.slice().reverse();
  let s = '<div class="row between"><h2>Buyurtmalarim</h2><button class="btn sm" data-act="reloadOrders">' + I.refresh + 'Yangilash</button></div>' +
    '<div class="chips"><button class="chip' + (S.otab === 'active' ? ' on' : '') + '" data-act="otab" data-k="active">Faol<span class="c">' + (act.length + q.length) + '</span></button><button class="chip' + (S.otab === 'done' ? ' on' : '') + '" data-act="otab" data-k="done">Bajarilgan<span class="c">' + done.length + '</span></button></div>';
  if (S.otab === 'done') return s + (done.length ? done.map(orderCard).join('') : '<div class="empty">' + I.list + '<b>Bajarilgan buyurtma yo\'q</b><span>Yetkazilgan va bekor qilingan buyurtmalar shu yerda turadi.</span></div>');
  if (!q.length && !act.length) return s + (S.loaded.orders ? '<div class="empty">' + I.list + '<b>Faol buyurtma yo\'q</b><span>«Do\'kon» bo\'limidan tovar tanlab buyurtma bering.</span><button class="btn pri" data-act="tab" data-k="shop">Do\'konga o\'tish</button></div>' : loading());
  s += q.map(o => '<div class="order"><div class="oh"><div><div class="code">Yuborilmagan</div><div class="small muted">' + fd(o.at) + ' · ' + PAY[o.pay] + '</div></div>' +
    (o.error ? '<span class="pill p-new">Xato</span>' : '<span class="pill p-pend">Navbatda</span>') + '</div><div class="ob">' + orderItems(o.view, showPrices()) +
    (o.error ? '<div class="note warn">' + h(o.error) + '</div>' : '<div class="small muted">Internet kelishi bilan o\'zi yuboriladi.</div>') + '</div>' +
    '<div class="oa">' + (o.error ? '<button class="btn sm" data-act="retryQ" data-id="' + o.clientOrderId + '">Qayta yuborish</button>' : '') + '<button class="btn sm danger" data-act="dropQ" data-id="' + o.clientOrderId + '" data-confirm="1">O\'chirish</button></div></div>').join('');
  return s + act.map(orderCard).join('');
}
function orderCard(o) {
  const needRcpt = o.pay === 'karta' && !o.receipt && ['new', 'accepted', 'onway'].includes(o.status);

    '<div class="ob">' + trackerHtml(o.status) + orderItems(o.items, showPrices()) +
    '<div class="row between"><span class="muted small">' + (o.items || []).length + ' xil tovar</span><b class="num">' + (o.final != null ? som(o.final) : (o.total != null && showPrices() ? som(o.total) : 'Narx tasdiqlanmoqda')) + '</b></div>' +
    (o.status === 'delivered' && o.paid != null ? '<div class="row between small"><span class="muted">To\'langan</span><span class="num">' + som(o.paid) + '</span></div>' : '') +
    (o.receipt ? '<div class="row small"><span class="okc">✓ To\'lov cheki yuborilgan</span><button class="btn sm ghost" data-act="viewImg" data-list="' + h(JSON.stringify([o.receipt])) + '">Ko\'rish</button></div>' : '') +
    (o.note ? '<div class="small muted">Izoh: ' + h(o.note) + '</div>' : '') + '</div>' +
    '<div class="oa">' + (o.status === 'new' ? '<button class="btn sm danger" data-act="cancel" data-id="' + o.id + '" data-confirm="1">Bekor qilish</button>' : '') +
    (needRcpt ? '<label class="btn sm" style="cursor:pointer" for="rc_' + o.id + '">' + I.note + 'To\'lov chekini yuborish</label><input id="rc_' + o.id + '" type="file" accept="image/*" hidden data-rcpt="' + o.id + '">' : '') +
    '<button class="btn sm" data-act="repeat" data-id="' + o.id + '">Yana shuni olish</button></div></div>';
}

/* ---------- hisobim ---------- */

    '<div class="kpi"><div class="lbl">Bu yil olingan</div><div class="v num">' + som(a.year.sales) + '</div></div><div class="kpi"><div class="lbl">Bu yil to\'langan</div><div class="v num">' + som(a.year.pays) + '</div></div></div>' +

      return '<div class="li"><div class="ic ' + t + '">' + (t === 'pay' ? '↓' : '↑') + '</div><div class="grow"><div class="t">' + ttl + '</div><div class="s">' + fd(e.at) + (e.note ? ' · ' + h(e.note) : '') + '</div></div><div class="right"><b class="num ' + (t === 'pay' ? 'okc' : '') + '">' + (t === 'pay' ? '−' : '+') + fmt(e.amount) + '</b></div></div>';
    }).join('') + '</div>' : '<div class="list"><div class="li"><span class="muted">Hali yozuv yo\'q</span></div></div>');
}

/* ---------- profil ---------- */
function vProfile() {
  const p = S.me || {}, sh = S.shop || {};
  return '<h2>Profil</h2><div class="list">' +
    [['Ism', p.name], ['Telefon', [p.phone, p.phone2].filter(Boolean).join(', ')], ['Do\'kon', p.shop], ['Manzil', [p.city, p.district, p.address].filter(Boolean).join(', ')], ['Mo\'ljal', p.landmark], ['Xaritada', p.lat ? p.lat + ', ' + p.lng : 'belgilanmagan']]
      .map(([k, v]) => '<div class="li"><div class="grow"><div class="s">' + k + '</div><div class="t" style="white-space:normal">' + h(v || '—') + '</div></div></div>').join('') + '</div>' +
    '<div class="row wrapr"><button class="btn" style="flex:1" data-act="editProfile">Ma\'lumotlarni o\'zgartirish</button><button class="btn" style="flex:1" data-act="passForm">Parolni almashtirish</button></div>' +
    '<div class="lbl">Xavfsizlik</div><div class="list">' + pinRow() + '</div>' +
    (canPin() ? '<div class="lbl">Telefon ekrani</div><div class="list"><div class="li"><div class="logo" style="width:44px;height:44px;flex:none">' + LOGO + (sh.appIcon ? '<img src="' + h(sh.appIcon) + '" alt=""' + IMGERR + '>' : '') + '</div><div class="grow"><div class="t">' + h(sh.appName || sh.name || "Elektr Do'kon") + '</div><div class="s">Do\'kon belgisini bosh ekranga qo\'shish</div></div><button class="btn sm" data-act="pinBrand">Qo\'shish</button></div></div>' : '') +
    (sh.phone || sh.address ? '<div class="card pad" style="display:flex;flex-direction:column;gap:8px"><div class="lbl">Sotuvchi bilan aloqa</div><b>' + h(sh.name || '') + '</b>' + (sh.phone ? '<div class="row between wrapr"><b class="num">' + h(sh.phone) + '</b>' + telLink(sh.phone) + '</div>' : '') + (sh.address ? '<div class="small muted">' + h(sh.address) + '</div>' : '') + (sh.hours ? '<div class="small muted">Ish vaqti: ' + h(sh.hours) + '</div>' : '') + '</div>' : '') +

function logout() {
  S.token = null; window.TOKEN = null; S.me = null; S.orders = []; S.account = null; S.tab = 'shop'; S.guest = false; S.view = null;
  ['token', 'me', 'orders', 'acc'].forEach(k => lsSet('m_' + k, null));
  S.cat = null; lsSet('m_cat', null); loadCatalog(); render();
}
function loggedIn(r) {
  S.token = r.token; window.TOKEN = r.token; S.me = r.me; S.guest = false; S.tab = 'shop';
  save('token'); save('me'); S.cat = null; lsSet('m_cat', null); S.slide = 0;
  window.scrollTo(0, 0); refreshAll(); render();
}
window.appBack = () => {
  if (!$('#mapPick').hidden) { $('#mapPick').hidden = true; return true; }
  if (!$('#viewer').hidden) { closeViewer(); return true; }
  if (S.view) { S.view = null; render(); return true; }
  if (S.token && S.tab !== 'shop') { S.tab = 'shop'; render(); return true; }
  if (S.guest) { S.guest = false; render(); return true; }
  return false;
};

/* ---------- harakatlar ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type !== 'radio' && el.type !== 'checkbox') return;
  if (needConfirm(el, ev)) return;
  const a = el.dataset.act, id = el.dataset.id, k = el.dataset.k;
  switch (a) {
    case 'authTab': S.authTab = k; render(); break;
    case 'guest': S.guest = true; S.tab = 'shop'; render(); break;
    case 'toAuth': S.guest = false; S.view = null; render(); break;
    case 'tab': S.tab = k; S.view = null; window.scrollTo(0, 0); if (k === 'orders') loadOrders(); if (k === 'account') loadAccount(); render(); break;
    case 'cat': S.catF = k; render(); break;
    case 'otab': S.otab = k; render(); break;
    case 'openProd': S.view = 'product'; S.pid = id; S.lastScroll = window.scrollY; window.scrollTo(0, 0); render(); break;
    case 'closeProd': S.view = null; render(); requestAnimationFrame(() => window.scrollTo(0, S.lastScroll || 0)); break;
    case 'galGo': { const g = $('#galTrack'); if (g) g.scrollTo({left: Number(el.dataset.i) * g.clientWidth, behavior: 'smooth'}); break; }
    case 'reload': S.loaded.catErr = 0; loadCatalog(); render(); break;
    case 'reloadOrders': loadOrders(); flushQueue(); toast('Yangilanmoqda…'); break;
    case 'reloadAcc': S.loaded.acc = 0; loadAccount(); render(); break;
    case 'inc': case 'dec': { const n = N(S.cart[id]) + (a === 'inc' ? 1 : -1); if (n <= 0) delete S.cart[id]; else S.cart[id] = n; save('cart'); render(); if (el.dataset.in) cartSheet(); break; }
    case 'openCart': cartSheet(); break;
    case 'closeSheet': closeSheet(); break;
    case 'clearCart': S.cart = {}; save('cart'); closeSheet(); render(); break;
    case 'copyCard': { const v = String(S.shop.card || '').replace(/\s/g, ''); try { await navigator.clipboard.writeText(v); toast('Karta raqami nusxalandi'); } catch (e) { toast(v); } break; }
    case 'rmRcpt': S.creceipt = null; cartSheet(); break;
    case 'repeat': { const o = S.orders.find(x => x.id === id); (o.items || []).forEach(it => { if (pById(it.pid)) S.cart[it.pid] = N(S.cart[it.pid]) + N(it.qty); }); save('cart'); S.tab = 'shop'; S.view = null; render(); cartSheet(); break; }
    case 'cancel': try { const r = await api('cancelOrder', {id}); S.orders = S.orders.map(o => o.id === id ? r.order : o); save('orders'); toast('Buyurtma bekor qilindi'); render(); } catch (e) { errToast(e); } break;
    case 'retryQ': { const q = S.queue.find(x => x.clientOrderId === id); if (q) { delete q.error; save('queue'); flushQueue(); } break; }
    case 'dropQ': S.queue = S.queue.filter(x => x.clientOrderId !== id); save('queue'); render(); break;
    case 'editProfile': openSheet(sheetHead('Ma\'lumotlarim') + '<form data-form="profile">' + profileFields(S.me, false) + '<button class="btn pri block" style="height:50px">Saqlash</button></form>'); break;
    case 'passForm': openSheet(sheetHead('Parolni almashtirish') + '<form data-form="pass"><div class="f"><label for="p_old">Hozirgi parol</label><input id="p_old" name="old" type="password" required></div><div class="f"><label for="p_new">Yangi parol (kamida 4 belgi)</label><input id="p_new" name="password" type="password" minlength="4" required></div><button class="btn pri block" style="height:50px">Saqlash</button></form>'); break;
    case 'logout': logout(); break;
    case 'pinBrand': addShortcut(); render(); break;
    case 'hideBrand': S.brandHidden = S.shop.brandV; lsSet('m_brandHide', S.brandHidden); render(); break;
    case 'mapPick': {
      const f = el.closest('form');
      openMapPicker(f.lat.value, f.lng.value, (la, ln) => { f.lat.value = la; f.lng.value = ln; const t = $('#geoTxt'); if (t) t.textContent = '✓ Belgilandi: ' + la + ', ' + ln; el.innerHTML = I.pin + 'Xaritada o\'zgartirish'; });
      break;
    }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { S.q = t.value; render(); }
  if (t.id === 'c_note') S.cnote = t.value;
  if (t.name === 'pay') { S.cpay = t.value; const b = $('#cardBox'); if (b) b.hidden = t.value !== 'karta'; }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.act === 'qty') { const n = N(t.value); if (n > 0) S.cart[t.dataset.id] = n; else delete S.cart[t.dataset.id]; save('cart'); render(); cartSheet(); }
  if (t.id === 'rcptFile' && t.files && t.files[0]) { try { S.creceipt = await compressImage(t.files[0], 1100, 0.7); cartSheet(); } catch (e) { toast('Rasmni ochib bo\'lmadi', true); } }
  if (t.dataset.rcpt && t.files && t.files[0]) {
    try { const img = await compressImage(t.files[0], 1100, 0.7); toast('Yuborilmoqda…'); const r = await api('attachReceipt', {id: t.dataset.rcpt, image: img}); S.orders = S.orders.map(o => o.id === r.order.id ? r.order : o); save('orders'); toast('To\'lov cheki yuborildi ✓'); render(); }
    catch (e) { errToast(e); }
  }
});
document.addEventListener('submit', async ev => {
  const f = ev.target, kind = f.dataset.form; if (!kind) return; ev.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries()), btn = f.querySelector('button:not([type=button])');
  if (kind === 'order') {
    const items = cartItems(); if (!items.length) return;
    const q = {clientOrderId: 'c' + rid(), items: items.map(i => ({pid: i.p.id, qty: i.qty})), pay: d.pay || 'naqd', note: (d.note || '').trim(), at: new Date().toISOString(),
      receipt: d.pay === 'karta' ? S.creceipt : null, view: items.map(i => ({name: i.p.name, unit: i.p.unit, qty: i.qty, price: i.p.price}))};
    S.queue.push(q); save('queue'); S.cart = {}; save('cart'); S.cnote = ''; S.cpay = ''; S.creceipt = null;
    closeSheet(); S.tab = 'orders'; S.otab = 'active'; S.view = null; render();
    await flushQueue();
    if (S.queue.some(x => x.clientOrderId === q.clientOrderId && !x.error)) toast("Internet yo'q: buyurtma telefonda saqlandi, internet kelganda o'zi yuboriladi", false, 5000);
    return;
  }
  busyBtn(btn, true);
  try {
    if (kind === 'login') loggedIn(await api('login', {phone: d.phone, password: d.password}));
    else if (kind === 'phone') {
      let digits = String(d.phone || '').replace(/\D/g, ''); if (digits.length === 9) digits = '998' + digits;
      if (digits.length !== 12) throw new Error("Telefon raqamni to'liq yozing: +998 va 9 ta raqam");
      const ph = '+' + digits; lsSet('m_phone', ph);
      if (d.password) loggedIn(await api('login', {phone: ph, password: d.password}));
      else {
        const pw = autoPass(ph);
        try { loggedIn(await api('login', {phone: ph, password: pw})); }
        catch (e1) {
          if (e1.code === 'net' || e1.code === 'limit') throw e1;
          try { loggedIn(await api('register', {phone: ph, password: pw, name: 'Mijoz ' + digits.slice(-4), address: '—'})); toast("Xush kelibsiz! Manzilingizni Profil bo'limida yozib qo'ying"); }
          catch (e2) { if (e2.code === 'exists') { S.needPass = true; S.authPhone = ph; render(); toast("Bu raqamga avval parol qo'yilgan. Parolingizni kiriting.", true, 4500); } else throw e2; }
        }
      }
    }
    else if (kind === 'register') { loggedIn(await api('register', d)); toast('Xush kelibsiz! Endi buyurtma bera olasiz'); }
    else if (kind === 'profile') { const r = await api('updateProfile', d); S.me = r.me; save('me'); closeSheet(); toast('Saqlandi'); render(); }
    else if (kind === 'pass') { const r = await api('changePassword', d); S.token = r.token; window.TOKEN = r.token; save('token'); closeSheet(); toast('Parol almashtirildi'); }
  } catch (e) { errToast(e); }
  busyBtn(btn, false);
});

});
render(); refreshAll();
lockNow();
