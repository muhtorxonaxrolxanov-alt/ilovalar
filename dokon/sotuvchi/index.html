<style>

/* Layout: one-column phone shell, sticky header, bottom tab bar; cards only for orders and products */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#E9EDF2; --fg:#111B25; --muted:#5A6878; --line:#D8DEE6;
  --accent:#F2A900; --on-accent:#1C1400; --wire:#1D57B5; --ok:#17804A; --warn:#B9520E; --bad:#C2302F;
  --ok-bg:#E3F4EA; --warn-bg:#FDEEDF; --bad-bg:#FBE6E5; --wire-bg:#E4ECFA;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(17,27,37,.06),0 4px 14px rgba(17,27,37,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#151E28; --surface2:#1E2935; --fg:#E7EDF3; --muted:#91A0B0; --line:#293644;
  --accent:#FFB81C; --on-accent:#1C1400; --wire:#79A7F2; --ok:#45C47F; --warn:#F09A55; --bad:#F27270;
  --ok-bg:#17301F; --warn-bg:#35230F; --bad-bg:#3A1818; --wire-bg:#18273D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#151E28; --surface2:#1E2935; --fg:#E7EDF3; --muted:#91A0B0; --line:#293644;
  --accent:#FFB81C; --on-accent:#1C1400; --wire:#79A7F2; --ok:#45C47F; --warn:#F09A55; --bad:#F27270;
  --ok-bg:#17301F; --warn-bg:#35230F; --bad-bg:#3A1818; --wire-bg:#18273D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wire);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.logo{overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.hero{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.hero>img,.hero-empty{display:block;width:100%;max-width:100%;aspect-ratio:16/7;object-fit:cover}
.hero-empty{display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-size:13px}
.hero .cap{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hero .cap b{font-family:var(--display);font-size:16px}
.bannerpick{width:100%;max-width:100%;aspect-ratio:16/7;border-radius:10px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:13px;border:1px dashed var(--line)}
.bannerpick img{width:100%;height:100%;object-fit:cover;display:block}
.brand-t{min-width:0}

.dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}



.net{background:var(--warn-bg);border-top:1px solid var(--line)}
.net.ok{background:var(--wire-bg)}
.net .wrap{padding-block:8px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.net svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.p-pend{background:var(--warn-bg);color:var(--warn)}

/* search */
.search{padding-block:10px 0}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px;background-image:none}
.search{position:relative}
.search svg{position:absolute;left:max(28px,calc(env(safe-area-inset-left,0px) + 12px));top:22px;width:18px;height:18px;color:var(--muted);pointer-events:none}

main{padding-block:14px 150px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{opacity:.65;margin-left:4px}

.btn{height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;flex:none}

.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.p-new{background:var(--bad-bg);color:var(--bad)}
.p-accepted{background:var(--wire-bg);color:var(--wire)}
.p-onway{background:var(--warn-bg);color:var(--warn)}
.p-delivered{background:var(--ok-bg);color:var(--ok)}
.p-cancelled{background:var(--surface2);color:var(--muted)}
.p-gray{background:var(--surface2);color:var(--muted)}
.debt{color:var(--bad);font-weight:700}
.okc{color:var(--ok);font-weight:700}

/* catalog */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;max-width:100%;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .ini{font-family:var(--display);font-size:22px;color:var(--muted)}
.prod .b{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .n{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.prod .pr{font-weight:700;font-size:15px}

.prod .foot{margin-top:auto;padding-top:6px}
.step{display:flex;align-items:center;justify-content:space-between;height:38px;border-radius:10px;background:var(--surface2);overflow:hidden}
.step button{width:42px;height:38px;border:0;background:transparent;font-size:20px;font-weight:600}
.step .q{font-weight:700}
.add{width:100%;height:38px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.add:disabled{background:var(--surface2);color:var(--muted)}

/* cart bar + nav */
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding-block:8px}
.cartbar .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cartbar button{width:100%;height:54px;border-radius:14px;border:0;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;box-shadow:var(--shadow)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{position:relative;height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--fg)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .dot{top:6px;right:calc(50% - 22px)}

/* order card */
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.order.is-new{border-color:var(--bad)}
.oh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px 14px 8px}
.oh .code{font-family:var(--display);font-size:14px}
.ob{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;font-size:14px;align-items:start}
.kv svg{width:16px;height:16px;color:var(--muted);margin-top:2px}
.items{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:6px}
.it{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.it input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.it .nm{flex:1;min-width:0}
.it.done .nm{text-decoration:line-through;color:var(--muted)}
.it .qq{font-weight:700;white-space:nowrap}
.oa{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface2)}
.oa .btn{flex:1;min-width:120px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.hero{grid-column:1/-1;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kpi.hero .lbl{color:var(--bg);opacity:.7}
.kpi.hero .v{font-family:var(--display);font-size:26px}
.kpi.hero .v.neg{color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;padding-top:8px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar .s{width:100%;display:flex;gap:2px;align-items:flex-end;height:120px}
.bar .s i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.bar .s i.a{background:var(--surface2);border:1px solid var(--line)}
.bar .s i.b{background:var(--accent)}
.bar .s i.b.neg{background:var(--bad)}
.bar span{font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{white-space:nowrap;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal}
.scroll{overflow-x:auto}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:18px;max-height:88%}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 13px;width:100%}
.f textarea{height:auto;min-height:72px;padding:11px 13px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-align:center;padding:6px}
.seg label small{font-weight:400;font-size:11.5px;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:14px;background:var(--surface2);border:1px solid var(--line);transition:.15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.sw input:checked+span{background:var(--ok);border-color:var(--ok)}
.sw input:checked+span::after{left:23px;background:#fff}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .ph{width:84px;height:84px;aspect-ratio:auto;border-radius:10px;flex:none}

.empty{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:42px;height:42px;opacity:.6}
.empty b{color:var(--fg);font-size:16px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--wire-bg);color:var(--fg)}
.note.warn{background:var(--warn-bg)}

.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:30px}
.login h1{font-size:28px;line-height:1.15}
.gbtn{background:var(--surface);border:1px solid var(--line)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--wire);font-weight:600;padding:4px 0}
.back svg{width:18px;height:18px}
.hist .li{align-items:flex-start}
.ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:700;font-size:15px}
.ic.sale{background:var(--bad-bg);color:var(--bad)} .ic.pay{background:var(--ok-bg);color:var(--ok)} .ic.debt{background:var(--warn-bg);color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.toast{animation:pop .18s ease-out}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{position:relative}.ph img{position:absolute;inset:0}
.logo{position:relative}.logo img{position:absolute;inset:0}
.hero .cap b{font-family:var(--display);font-size:16px}
a.btn{text-decoration:none;color:var(--fg)}
/* ---- v1.1 ---- */
.search{position:relative;z-index:12}
.sugg{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:56px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(17,27,37,.16);padding:6px;max-height:60vh;overflow:auto;z-index:25}
.sg-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 8px 6px}
.sg-h svg{width:15px;height:15px;color:var(--accent)}
.sg-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 8px}

/* karusel */
.car{position:relative;border-radius:16px;overflow:hidden;background:var(--fg)}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}

async function compressImage(file, max, q, square) {
  max = max || 600; q = q || 0.75;
  const src = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
  const k = Math.min(1, max / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);

}

const normQ = s => String(s || '').toLowerCase().replace(/[ʻʼ'’‘`"]/g, '').replace(/(.)\1+/g, '$1').trim();
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function matchScore(name, q) {
  const n = normQ(name), x = normQ(q);
  if (!x) return 0;
  if (n.startsWith(x)) return 100;
  const words = n.split(/[\s\-·,.()/]+/);
  if (words.some(w => w.startsWith(x))) return 80;
  if (n.includes(x)) return 60;
  if (x.length >= 4 && words.some(w => lev(w.slice(0, x.length), x) <= (x.length > 6 ? 2 : 1))) return 30;   // xato yozilsa ham topadi
  return 0;
}
const matchText = (text, q) => !q || matchScore(text, q) > 0 || String(text).toLowerCase().includes(String(q).toLowerCase());
function hlName(n, q) {
  const i = String(n).toLowerCase().indexOf(String(q).toLowerCase().trim());
  if (i < 0 || !q.trim()) return h(n);
  return h(n.slice(0, i)) + '<b>' + h(n.slice(i, i + q.trim().length)) + '</b>' + h(n.slice(i + q.trim().length));
}

function sha256(s) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b = unescape(encodeURIComponent(s)), l = b.length, w = [];
  for (let i = 0; i < l; i++) w[i >> 2] |= b.charCodeAt(i) << (24 - (i % 4) * 8);
  w[l >> 2] |= 0x80 << (24 - (l % 4) * 8); w[((l + 8) >> 6 << 4) + 15] = l * 8;
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < w.length; i += 16) {
    const W = []; let [a, bb, c, d, e, f, g, hh] = H;
    for (let t = 0; t < 64; t++) {
      W[t] = t < 16 ? (w[i + t] | 0) : (r(W[t - 2], 17) ^ r(W[t - 2], 19) ^ (W[t - 2] >>> 10)) + W[t - 7] + (r(W[t - 15], 7) ^ r(W[t - 15], 18) ^ (W[t - 15] >>> 3)) + W[t - 16] | 0;
      const t1 = hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + W[t] | 0, t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c)) | 0;
      hh = g; g = f; f = e; e = d + t1 | 0; d = c; c = bb; bb = a; a = t1 + t2 | 0;
    }
    H = H.map((x, k) => x + [a, bb, c, d, e, f, g, hh][k] | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

function receiptLines(o, shop, balance, W) {

  const L = [], line = (a, b) => { a = ascii(a); b = ascii(b); const sp = W - a.length - b.length; return sp >= 1 ? a + ' '.repeat(sp) + b : a + '\n' + ' '.repeat(Math.max(0, W - b.length)) + b; };
  const wrap = t => { const out = []; ascii(t).split(' ').forEach(w => { if (!out.length || (out[out.length - 1] + ' ' + w).length > W) out.push(w); else out[out.length - 1] += ' ' + w; }); return out; };
  const sum = n => fmt(n);
  L.push({c: 1, b: 1, t: shop.name || "222 Aksessuar"});
  [shop.address, shop.phone].filter(Boolean).forEach(x => L.push({c: 1, t: x}));
  L.push({t: '-'.repeat(W)});
  L.push({t: line('Chek No ' + o.code, fday(o.at || new Date()))});
  L.push({t: 'Mijoz: ' + ascii(o.cname || '')});
  if (o.phone) L.push({t: 'Tel: ' + o.phone});
  L.push({t: '-'.repeat(W)});
  (o.items || []).forEach(it => {
    wrap(it.name).forEach(x => L.push({t: x}));
    L.push({t: line('  ' + fmt(it.qty) + ' ' + (it.unit || '') + ' x ' + sum(it.price), sum(N(it.price) * N(it.qty)))});
  });
  L.push({t: '-'.repeat(W)});
  const total = o.final != null ? o.final : (o.items || []).reduce((s, i) => s + N(i.price) * N(i.qty), 0);
  L.push({b: 1, t: line('JAMI:', sum(total) + " so'm")});
  if (o.paid != null) L.push({t: line("To'landi:", sum(o.paid) + " so'm")});
  if (o.paid != null && total - o.paid > 0) L.push({t: line('Qarzga yozildi:', sum(total - o.paid) + " so'm")});
  if (balance != null) L.push({t: line('Umumiy qarz:', sum(Math.max(0, balance)) + " so'm")});
  L.push({t: line("To'lov turi:", PAY[o.pay] ? ascii(PAY[o.pay]) : '')});
  L.push({t: '-'.repeat(W)});
  L.push({c: 1, t: 'Xaridingiz uchun rahmat!'});
  L.push({c: 1, t: fd(new Date())});
  return L;
}
function receiptText(o, shop, balance) { return receiptLines(o, shop, balance).map(x => x.t).join('\n'); }
function escpos(lines) {
  const out = [0x1B, 0x40, 0x1B, 0x74, 0x00];
  const push = s => { for (const ch of s) out.push(ch.charCodeAt(0) & 0x7F); };
  lines.forEach(l => {
    out.push(0x1B, 0x61, l.c ? 1 : 0); out.push(0x1B, 0x45, l.b ? 1 : 0);

}

    rows.map(r => '<pre class="' + (r.c ? 'c ' : '') + (r.b ? 'b ' : '') + (r.b && r.c ? 'big' : '') + '">' + h(r.t) + '</pre>').join('') + '</body></html>';

  const r = S.rep;
  if (!r || r.period !== S.period) return s + loading();
  const mx = Math.max(1, ...r.months.map(m => Math.max(m.sales, Math.abs(m.netProfit))));
  const card = (k, lbl, v, cls, sub) => '<div class="kpi tap" data-act="repDetail" data-k="' + k + '"><div class="lbl">' + lbl + '</div><div class="v num ' + (cls || '') + '">' + som(v) + '</div>' + (sub ? '<div class="small muted">' + sub + '</div>' : '') + '</div>';
  return s + '<div class="small muted">Har bir kartochkani bosing — kimga sotilgani, kim to\'lagani, kimda qarz borligi ochiladi.</div>' +
    '<div class="kpis"><div class="kpi hero tap" data-act="repDetail" data-k="net"><div class="lbl">Sof foyda · ' + pl[S.period].toLowerCase() + '</div><div class="v num' + (r.netProfit < 0 ? ' neg' : '') + '">' + som(r.netProfit) + '</div></div>' +
    card('sales', 'Savdo', r.sales, '', r.salesCount + ' ta savdo') + card('cost', 'Tannarx (kelish)', r.cost) +
    card('gross', 'Yalpi foyda', r.grossProfit, '', (r.sales ? Math.round(r.grossProfit / r.sales * 100) : 0) + '% ustama') + card('exp', 'Xarajatlar', r.expenses, 'debt') +
    card('pays', 'Qo\'lga kelgan pul', r.pays, 'okc') + card('debt', 'Mijozlardagi qarz', r.totalDebt, 'debt', (r.debtors || []).length + ' kishi · hozirgi holat') + '</div>' +
    '<div class="card pad"><div class="row between wrapr"><h3>Oxirgi 12 oy</h3><div class="legend"><span><i style="background:var(--surface2);border:1px solid var(--line)"></i>Savdo</span><span><i style="background:var(--accent)"></i>Sof foyda</span></div></div><div class="bars">' +
    r.months.map(m => { const mi = Number(m.month.slice(5)) - 1; return '<div class="bar" title="' + ymName(m.month) + ': savdo ' + fmt(m.sales) + ', sof foyda ' + fmt(m.netProfit) + '"><div class="s"><i class="a" style="height:' + (m.sales / mx * 100) + '%"></i><i class="b' + (m.netProfit < 0 ? ' neg' : '') + '" style="height:' + (Math.abs(m.netProfit) / mx * 100) + '%"></i></div><span>' + MON[mi] + '</span></div>'; }).join('') + '</div></div>' +
    '<div class="card pad"><h3>🔥 Ko\'p sotilayotgan tovarlar</h3><div class="small muted" style="margin:2px 0 10px">Oxirgi 30 kun, so\'mda</div>' + hbars((r.topNow || []).map(x => ({name: x.name, v: x.now, note: fmt(x.nowQty) + ' ' + (x.unit || '') + ' sotildi'}))) + '</div>' +
    ((r.rising || []).length ? '<div class="card pad"><h3>📈 Savdosi o\'sayotganlar</h3><div class="small muted" style="margin:2px 0 10px">Kulrang — oldingi 30 kun, yashil — oxirgi 30 kun</div>' + hbars(r.rising.map(x => ({name: x.name, v: x.now, v2: x.before})), 'g') + '</div>' : '') +
    '<div class="card pad"><h3>📉 Savdosi tushgan tovarlar</h3><div class="small muted" style="margin:2px 0 10px">Oldin ko\'p sotilgan, hozir kam. Kulrang — oldingi 30 kun, qizil — oxirgi 30 kun</div>' + ((r.falling || []).length ? hbars(r.falling.map(x => ({name: x.name, v: x.now, v2: x.before})), 'n') : '<div class="small muted">Savdosi tushgan tovar yo\'q 👍</div>') + '</div>' +
    '<div class="card pad"><h3>💤 Sotilmayotgan tovarlar</h3><div class="small muted" style="margin:2px 0 10px">Oxirgi 60 kunda birorta ham sotilmagan</div>' + ((r.notSelling || []).length ? '<div class="sg-chips" style="padding:0">' + r.notSelling.map(x => '<span class="chip" style="height:auto;padding:6px 12px;white-space:normal">' + h(x.name) + (x.last ? ' <span class="muted small">· oxirgi ' + fday(x.last) + '</span>' : ' <span class="muted small">· hech sotilmagan</span>') + '</span>').join('') + '</div>' : '<div class="small muted">Hamma tovar sotilyapti 👍</div>') + '</div>' +
    '<div class="row between"><div class="lbl">Xarajatlar · ' + pl[S.period].toLowerCase() + '</div><button class="btn sm" data-act="expForm">' + I.plus + 'Xarajat</button></div>' +
    (r.expenseList.length ? '<div class="list">' + r.expenseList.map(x => '<div class="li"><div class="grow"><div class="t">' + h(x.cat) + '</div><div class="s">' + fday(x.at) + (x.note ? ' · ' + h(x.note) : '') + '</div></div><div class="right"><b class="num debt">−' + fmt(x.amount) + '</b><div><button class="btn sm ghost" style="height:26px;padding:0 6px;font-size:12px;color:var(--muted)" data-act="delExp" data-id="' + h(x.id) + '" data-confirm="1">o\'chirish</button></div></div></div>').join('') + '</div>'
      : '<div class="list"><div class="li"><span class="muted">Bu davrda xarajat yozilmagan. Benzin, ijara, ish haqi kabi chiqimlarni yozing — sof foyda aniq chiqadi.</span></div></div>');
}
function repDetail(k) {
  const r = S.rep, pl = {m: 'bu oy', pm: 'o\'tgan oy', y: 'bu yil', all: 'hammasi'}[S.period];
  const li = (a, b, c, d) => '<div class="li"><div class="grow"><div class="t" style="white-space:normal">' + a + '</div><div class="s" style="white-space:normal">' + b + '</div></div><div class="right"><b class="num ' + (d || '') + '">' + c + '</b></div></div>';
  const empty = '<div class="empty"><b>Bu davrda yozuv yo\'q</b></div>';
  let title = '', body = '';
  if (k === 'sales' || k === 'cost' || k === 'gross') {
    title = {sales: 'Savdo', cost: 'Tannarx', gross: 'Yalpi foyda'}[k] + ' · ' + pl;
    const byC = {}; r.salesList.forEach(e => { const x = byC[e.cname] || (byC[e.cname] = {name: e.cname, v: 0, n: 0}); x.v += k === 'sales' ? e.amount : k === 'cost' ? e.cost : e.profit; x.n++; });
    const top = Object.values(byC).sort((a, b) => b.v - a.v).slice(0, 8);
    body = (top.length ? '<div class="card pad"><h3>Mijozlar bo\'yicha</h3><div style="margin-top:10px">' + hbars(top.map(x => ({name: x.name, v: x.v, note: x.n + ' ta savdo'}))) + '</div></div>' : '') +
      (r.salesList.length ? '<div class="lbl">Har bir savdo</div><div class="list">' + r.salesList.map(e => li(h(e.cname) + (e.orderCode ? ' · № ' + h(e.orderCode) : ''), fd(e.at) + ((e.items || []).length ? ' · ' + h(e.items.map(i => i.name + ' ' + fmt(i.qty) + ' ' + (i.unit || '')).join(', ')) : ''), fmt(k === 'sales' ? e.amount : k === 'cost' ? e.cost : e.profit), k === 'gross' ? 'okc' : '')).join('') + '</div>' : empty);
  } else if (k === 'net') {
    title = 'Sof foyda · ' + pl;
    body = '<div class="list">' + li('Savdo', 'Sotilgan tovarlar summasi', som(r.sales)) + li('− Tannarx', 'Shu tovarlar sizga necha pulga tushgani', som(r.cost)) + li('= Yalpi foyda', '', som(r.grossProfit), 'okc') + li('− Xarajatlar', 'Benzin, ijara, ish haqi va boshqalar', som(r.expenses), 'debt') + li('= Sof foyda', 'Qo\'lingizda qoladigan haqiqiy foyda', som(r.netProfit), r.netProfit < 0 ? 'debt' : 'okc') + '</div>' +
      '<div class="card pad"><h3>Eng ko\'p foyda bergan tovarlar</h3><div style="margin-top:10px">' + hbars((r.topProducts || []).map(x => ({name: x.name, v: x.profit, note: fmt(x.qty) + ' ' + (x.unit || '') + ' · savdo ' + fmt(x.sales)}))) + '</div></div>';
  } else if (k === 'exp') {
    title = 'Xarajatlar · ' + pl;
    const byC = {}; r.expenseList.forEach(x => byC[x.cat] = (byC[x.cat] || 0) + x.amount);
    body = (r.expenseList.length ? '<div class="card pad"><h3>Turlari bo\'yicha</h3><div style="margin-top:10px">' + hbars(Object.keys(byC).map(c => ({name: c, v: byC[c]})).sort((a, b) => b.v - a.v)) + '</div></div><div class="lbl">Har bir xarajat</div><div class="list">' + r.expenseList.map(x => li(h(x.cat), fday(x.at) + (x.note ? ' · ' + h(x.note) : ''), '−' + fmt(x.amount), 'debt')).join('') + '</div>' : empty);
  } else if (k === 'pays') {
    title = 'Qo\'lga kelgan pul · ' + pl;
    body = r.paysList.length ? '<div class="list">' + r.paysList.map(e => li(h(e.cname), fd(e.at) + ' · ' + h(e.method || 'Naqd') + (e.orderCode ? ' · № ' + h(e.orderCode) : '') + (e.note ? ' · ' + h(e.note) : ''), '+' + fmt(e.amount), 'okc')).join('') + '</div>' : empty;
  } else if (k === 'debt') {
    title = 'Kimda qancha qarz';
    body = (r.debtors || []).length ? '<div class="card pad">' + hbars(r.debtors.slice(0, 10).map(x => ({name: x.name, v: x.balance}))) + '</div><div class="list">' + r.debtors.map(x => '<button class="li" data-act="openCust" data-id="' + h(x.id) + '"><div class="grow"><div class="t">' + h(x.name) + '</div><div class="s">' + h([x.shop, x.phone].filter(Boolean).join(' · ')) + '</div></div><div class="right"><b class="num debt">' + som(x.balance) + '</b></div></button>').join('') + '</div>' : '<div class="empty"><b>Hech kimda qarz yo\'q 👍</b></div>';
  }
  openSheet(sheetHead(title) + body);
}

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'p_promo') { const f = $('#promoF'); if (f) f.hidden = !t.checked; return; }
  if (!(t.files && t.files[0])) return;
  try {
    if (t.id === 'p_imgs') {
      const files = Array.from(t.files).slice(0, 6 - PF.imgs.length);
      for (const f of files) PF.imgs.push(await compressImage(f, 1000, 0.75));
      if (t.files.length > files.length) toast('Ko\'pi bilan 6 ta rasm', true);
      drawPImgs();
    }
    if (t.id === 'p_vid') {
      const f = t.files[0];
      if (f.size > 20 * 1024 * 1024) { toast('Video juda katta (' + Math.round(f.size / 1048576) + ' MB). 20 MB gacha bo\'lsin — qisqaroq video oling.', true, 5000); return; }

    }
    if (t.id === 's_banner' || t.id === 's_logo') { const b = t.id === 's_banner'; const url = await compressImage(t.files[0], b ? 1200 : 256, b ? 0.75 : 0.85, !b); t.form[b ? 'banner' : 'logo'].value = url; t.form[b ? 'removeBanner' : 'removeLogo'].value = ''; $(b ? '#bannerPrev' : '#logoPrev').innerHTML = (b ? '' : LOGO) + '<img src="' + url + '" alt="">'; }

document.addEventListener('submit', async ev => {
  const f = ev.target, kind = f.dataset.form; if (!kind) return; ev.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries()), btn = f.querySelector('button:not([type=button])');
  if (kind === 'login') {
    const r = await act(() => api('sellerLogin', {email: d.email, password: d.password}), null, btn);
    if (r) { S.token = r.token; window.TOKEN = r.token; S.email = r.email; S.shop = r.shop || {}; lsSet('s_token', S.token); lsSet('s_email', S.email); lsSet('s_shop', S.shop); S.tab = 'orders'; loadOrders(); poll(); render(); if (r.mustChange) passSheet(true); else setTimeout(loadSet, 1500); }
  } else if (kind === 'login2') {
    const r = await act(() => api('changeLogin', {password: d.password, newEmail: d.newEmail || undefined, newPassword: d.newPassword || undefined}), 'Saqlandi', btn);
    if (r) { S.token = r.token; window.TOKEN = r.token; S.email = r.email; lsSet('s_token', S.token); lsSet('s_email', S.email); closeSheet(); if (S.tab === 'settings') loadSet(); }
  } else if (kind === 'deliver') {
    const o = S.od.orders.find(x => x.id === f.dataset.id);
    const prices = (o.items || []).map((_, i) => N(f['pr_' + i].value));
    const r = await act(() => api('deliver', {id: o.id, prices, paid: N(d.paid)}), null, btn);
    if (r) { (o.items || []).forEach((_, i) => delete S.prep[o.id + '_' + i]); lsSet('s_prep', S.prep); toast('Yetkazildi va hisobga yozildi' + (r.debtAdded > 0 ? ' · qarz ' + som(r.debtAdded) : '')); loadOrders(); receiptSheet(r.order, r.balance); }
  } else if (kind === 'cust') {
    const r = await act(() => api('saveCustomer', Object.assign({id: f.dataset.id || undefined}, d)), 'Saqlandi', btn);
    if (r) { closeSheet(); S.tab = 'clients'; S.cview = r.customer.id; loadCd(); render(); }
  } else if (kind === 'entry') {
    const r = await act(() => api('addEntry', Object.assign({cid: S.cview, type: f.dataset.k}, d)), 'Yozildi', btn);
    if (r) { closeSheet(); loadCd(); }
  } else if (kind === 'rp') {
    if (await act(() => api('resetPassword', {id: S.cview, password: d.password}), 'Yangi parol: ' + d.password + ' — mijozga ayting', btn)) closeSheet();
  } else if (kind === 'prod') {
    const body = {id: f.dataset.id || undefined, name: d.name, cat: d.cat, unit: d.unit, cost: N(d.cost), price: N(d.price), desc: d.desc, active: !!d.active,
      images: PF.imgs.slice(), promo: !!d.promo, promoText: d.promoText || '', oldPrice: N(d.oldPrice)};
    if (PF.video) body.video = PF.video; else if (PF.removeVideo) body.removeVideo = true;
    if (PF.video || PF.imgs.some(x => x.indexOf('data:') === 0)) toast('Fayllar yuklanmoqda, kuting…', false, 8000);
    const r = await act(() => api('saveProduct', body), 'Tovar saqlandi', btn);
    if (r) { closeSheet(); loadProds(); }
  } else if (kind === 'exp') {
    if (await act(() => api('addExpense', d), 'Xarajat yozildi', btn)) { closeSheet(); loadRep(); }
  } else if (kind === 'shop') {
    const body = {name: d.name, tagline: d.tagline, phone: d.phone, address: d.address, hours: d.hours, card: d.card, cardOwner: d.cardOwner, defaultShowPrices: !!d.defaultShowPrices};
    ['logo', 'banner'].forEach(k => { if (d[k]) body[k] = d[k]; });
    if (d.removeLogo) body.removeLogo = true; if (d.removeBanner) body.removeBanner = true;
    const r = await act(() => api('saveSettings', body), 'Saqlandi', btn);
    if (r) { S.set = r.settings; S.shop = {name: r.settings.name, logo: r.settings.logo, phone: r.settings.phone, address: r.settings.address}; lsSet('s_shop', S.shop); closeSheet(); render(); }
  } else if (kind === 'brand') {
    const body = {appName: d.appName}; if (d.appIcon) body.appIcon = d.appIcon;
    const r = await act(() => api('saveSettings', body), 'Saqlandi. Mijozlarda belgi yangilanadi', btn);
    if (r) { S.set = r.settings; closeSheet(); render(); }
  } else if (kind === 'ownBrand') {
    lsSet('s_own', {name: d.name, icon: d.icon});
    try { Android.pinShortcut(d.name || "Do'kon Sotuvchi", d.icon || '', 'pin'); } catch (e) { toast('Bu telefonda ishlamaydi', true); }
    closeSheet(); render();
  } else if (kind === 'tg') {
    if (!d.telegramToken) { toast('Bot tokenini kiriting', true); return; }
    const r = await act(() => api('telegramDetect', {telegramToken: d.telegramToken.trim()}), 'Telegram ulandi ✓', btn);
    if (r) loadSet();
  }
});

  S.gating = false; render();
}

      { x: 'Yopish', h: '✖ Yopish', d: 'Oynadagi «Yopish» bitta qadam orqaga qaytaradi: masalan do’kon oynasidan — do’konlar ro’yxatiga; oyna ichidan boshqa oyna ochilgan bo’lsa — oldingisiga (yozganlaringiz saqlanadi); eng birinchisida — oyna yopiladi. Oynaning tashqarisini yoki telefonning «Orqaga» tugmasini bossangiz ham shunday. Hodim ilovasida ham bir xil.' },
      { x: 'Adashib berilgan', h: '↩️ Adashib berilgan', d: 'Non boshqa do’konga adashib «berildi» qilingan bo’lsa, shu tugmani bosing: bugungi berilganlar bekor bo’ladi va buyurtma yana «berish kerak» ro’yxatiga qaytadi.' },
      { x: 'Namangan', h: '🏭 Namangan', d: 'Namangan ilovasi xuddi shu ilovaning o’zi, tugmalari ham, ishlashi ham bir xil. Farqi bitta: Namangan ma’lumoti Toshkent ilovasiga boradi va shu yerda (Hisobot → 🏭 Namangan) ko’rinadi. Non nomlari (Patir, Lepeshka…) Namangan’da ham Toshkentdagidek chiqadi. Bir marta ulansangiz bo’ldi: ilova yangilansa ham, qayta ochilsa ham ulanish saqlanadi; uzilib qolsa, ilova o’zi qayta ulanadi va qayta kod so’ramaydi.' },
      { x: 'Mashina', h: '🚚 Mashina', d: 'Mashinaga nechta non yuklandi, do\'konlarga nechtasi berildi va mashinada nechtasi qoldi. Yetmasa ogohlantiradi. Ikki nonvoyxona bo\'lsa, yuklashdan oldin qaysi nonvoyxonadan olinganini bosing: 1- va 2-nonvoyxona nonlari alohida ro\'yxatda, alohida jami bilan turadi.' },
      { x: 'Tushirib qo\'yildi', h: '📥 Mashinadan tushirib qo\'yildi', d: 'Mashinadagi non nonvoyxonaga tushirilganda yozasiz: 1) qaysi nonvoyxonadan olingan; 2) qaysi nonvoyxonaga tushirildi; 3) non turi; 4) soni (faqat raqam). Tugmani bossangiz, o\'sha son «Mashinada»dan ayriladi va ro\'yxatda «Olindi: 1-nonvoyxona → Tushirildi: 2-nonvoyxona» deb vaqti bilan turadi. Mashinadagidan ko\'p yozsangiz, ilova avval so\'raydi. Xato bo\'lsa 🗑 bosing — non mashinaga qaytadi.' },
      { x: 'Kassa', h: '💵 Kassa', d: 'Kun davomida kassadan olingan pullarni yozasiz. Kechqurun ilova kassa to\'g\'ri, kam yoki ortiqchaligini o\'zi hisoblaydi.' },
      { x: 'Hodimlar', h: '👷 Hodimlar', d: 'Hodimlar, ularning qop haqi, kunlik va oylik maoshi, avansi. «Xodimlar va kodlar» bo\'limida har hodimga kirish kodi berasiz — hodim Sizning raqamingiz va shu kod bilan kiradi.' },
      { x: 'Xarajat', h: '🧾 Xarajat', d: 'Kunlik xarajatlar: un, gaz, svet va boshqalar. Hisobotda foydadan ayriladi.' },
      { x: 'Non turlari', h: '🍞 Non turlari', d: 'Qanday nonlar yopilishi, narxi va retsepti (1 qop un uchun nima kerak).' },
      { x: 'Hisobot', h: '📊 Hisobot', d: 'Kun, hafta, oy bo\'yicha jami: berilgan non, olingan pul, nasiya, xarajat va foyda.' },
      { sel: '.pxl', h: '🎬 Jonli sahna', d: 'Nonvoyxonaning bugungi holati: omborga nima kirdi, hamirchi necha qop qildi, tandirda necha non yopildi, do\'konlarga qancha ketdi. Hodimlar yozgan zahoti shu yer o\'zgaradi.' },
      { sel: '#fab', h: '🎤 Ovozli yordamchi', d: 'Bosing va gapiring: «Anorga 15 ta patir berildi». Yordamchi nima qilishini ko\'rsatadi, «Ha» desangiz bajaradi.' },
      { sel: '#gear', h: '⚙ Sozlamalar', d: 'Nonvoyxona nomi, bildirishnomalar, ko\'rinish va boshqa sozlamalar.' }] },
    /* ---------- Nonvoyxona: hodim ---------- */
    th: { t: '🥖 Nonvoyxona — hodim', i: 'Hodim ilovasi: hamirchi, yopuvchi yoki sotuvchi ishini yozadi. Yozganlaringiz rahbarga o\'zi boradi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '#ph', h: '📱 Rahbar raqami', d: 'Birinchi marta: rahbaringizning telefon raqamini yozing (o\'zingiznikini emas).' },
      { sel: '#cd2', h: '🔑 Kod', d: 'Rahbar Sizga bergan shaxsiy kodni yozing va «Kirish» ni bosing.' },
      { x: 'Hamir', h: '🥣 Hamir', d: 'Hamirchi: nechta qop hamir qilganingizni yozasiz. Vazifa bajarilsa salyut chiqadi.' },
      { x: 'tandir', h: '🔥 Tandirlar', d: 'Yopuvchi: har tandirda nechta non yopilganini yozasiz (1-tandir, 2-tandir…).' },
      { x: 'Kassa', h: '💵 Kassa', d: 'Kun oxirida kassadagi pulni yozasiz. Kassadan pul olinsa, shu yerda belgilaysiz.' },
      { x: 'Yuborish', h: '📤 Yuborish', d: 'Internet bo\'lmasa yozuvlar telefonda saqlanadi. Internet kelganda o\'zi yoki shu tugma bilan rahbarga ketadi.' }] },
    /* ---------- Hisob-kitob ---------- */
    'hk-i': { t: '⚡ Hisob-kitob', i: 'Usta uchun: obyektlar, qilingan ishlar, olingan pul, shogirtlar va hisobot. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { x: 'Shit sxemasi', h: '📐 Shit sxemasi', d: 'Shitni haqiqiy avtomatlar bilan yig\'ib, narxini hisoblaydi.' },
      { x: 'Santexnika', h: '🚿 Santexnika sxemasi', d: 'Qozonxona, kollektor va quvurlar bilan sxema va narx.' },
      { x: 'Hisob-kitob', h: '🧾 Hisob-kitob', d: 'Asosiy bo\'lim: obyektlar, ishlar, pullar, shogirtlar.' },
      { sel: '#payb', h: '💳 To\'lov', d: 'Obunani uzaytirish: tarifni tanlab, kartaga o\'tkazasiz va chek rasmini yuborasiz.' },
      { sel: '#prof', h: '👤 Profil', d: 'Sohangiz, parolni o\'zgartirish va ilovadan chiqish.' }] },
    'hk-h': { t: '🧾 Hisob-kitob', i: 'Obyektlar, shogirtlar va hisobot. Hamma yozuv bulutga o\'zi saqlanadi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '#hkm', h: '🎤 Ovoz bilan yozish', d: 'O’ng pastdagi qizil 🎤. Avval yozmoqchi bo’lgan maydonni bosing, keyin 🎤 ni bosib gapiring, tugatgach yana bosing — gap shu maydonga yoziladi (raqam maydoniga faqat son). Birinchi marta «Mikrofonga ruxsat berasizmi?» chiqadi — «Ruxsat berish» ni bosing.' },
      { sel: '#t1', h: '🏗 Obyektlar', d: 'Ish qilayotgan joylaringiz. Obyektni bossangiz: qilingan ishlar va olingan pullar.' },
      { sel: '#oq', h: '🔍 Qidiruv', d: 'Obyektni nomi, mijoz ismi yoki raqami bo\'yicha tez topish.' },
      { sel: '#addBtn', h: '➕ Qo\'shish', d: 'Yangi obyekt (yoki Shogirtlar bo\'limida — yangi shogird) qo\'shish.' },
      { sel: '[data-a="additem"]', h: '➕ Ish / tochka', d: 'Qilingan ish: nima ish, nechta, bittasi necha pul.' },
      { sel: '[data-a="addrecv"]', h: '💵 Olingan pul', d: 'Mijozdan olingan pulni yozasiz. Keyin mijozga chek yuborish taklif qilinadi.' },
      { sel: '#t4', h: '💸 Xarajatlar', d: 'Rasxodlaringizni yozib borasiz. Obyektni (yoki «📦 Umumiy») bosing, turini tanlang — 🧱 Material, 🚕 Yo’l, 🍽 Ovqat, 🔧 Asbob, 👷 Usta, 📦 Boshqa — summani yozib «Saqlash». Xarajat obyekt sahifasida, Hisobotda va «O’zimga qolgan»da hisoblanadi. Mijozga ko’rsatiladigan hisobda chiqmaydi.' },
      { sel: '.bzbig', h: '🛒 Bozordan olingan tovarlar', d: 'Bozordan material olsangiz shu yerga yozasiz. Bosing → «📷 Rasmga olish» (chek, nakladnoy yoki qo‘lda yozilgan qog‘oz) — sun’iy intellekt rasmni o‘qib, har bir tovarni nomi, soni va 1 dona narxi bilan ro‘yxat qiladi, summani o‘zi hisoblaydi (10–30 soniya). «🖼 Rasm tanlash» — galereyadagi rasm (bir nechtasini birdan tanlasa bo‘ladi). «✍️ Matndan» — har qatorga bitta tovar yozasiz, masalan «rozetka 5 ta 25 ming». Ro‘yxatni tekshiring: noto‘g‘ri bo‘lsa katakni bosib to‘g‘rilang, «✕» — qatorni o‘chirish, «+ Qator qo‘shish» — qo‘lda qo‘shish. Narxi yozilmagan tovar qizil ramkada. Oxirida «✓ Saqlash».' },
      { sel: '.bzmz', h: '🏠 Mijoz to‘laydi', d: 'Belgi qo‘yilgan bo‘lsa (odatda shunday), bozor ro‘yxati uy egasiga yuboriladigan hisobda («Mijozga ko‘rsatish», rasm va matn) alohida «🛒 Bozordan olingan tovarlar» bo‘limi bo‘lib chiqadi: har bir tovar, soni, narxi va «Bozor jami». Bu summa «Jami narx» va «Qolgan pul»ga qo‘shiladi. Belgini olib tashlasangiz — faqat o‘zingizning xarajatingiz bo‘lib qoladi.' },
      { sel: '[data-ecat]', h: '⚡ Tez yozish', d: 'Turini bosing — oyna o’sha tur bilan ochiladi, faqat summani yozasiz. Noto’g’ri yozilganini ✕ bilan o’chirasiz.' },
      { sel: '#t2', h: '👷 Shogirtlar', d: 'Shogirtlar: kunlik haqi, ishlagan kunlari, berilgan pul va qarz. «📤 Ilovaga taklif» bilan shogirdga havola yuborasiz.' },
      { sel: '[data-cinv]', h: '📤 Ilovaga taklif', d: 'Shogirdga havola yuboradi. U havolani ochib, parol qo\'yadi va obyektlaringizda «ishladim» deb yoza oladi.' },
      { sel: '#t3', h: '📊 Hisobot', d: 'Jami olingan pul, mijozlardan qolgan qarz, shogirtlarga berilgan pul va qarz, obyektlar bo\'yicha shogirdlar.' },
      { sel: '[data-a="gear"]', h: '⚙ Sozlamalar', d: 'Profil, ilova nomi va belgisi, ko\'rinish, zaxira nusxa.' }] },
    'hk-sg': { t: '👷 Shogird', i: 'Ustangizning obyektlarida ishlagan kunlaringizni yozasiz. Ustangiz ham ko\'radi. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [

    'hk-sx': { t: '📐 Shit sxemasi', i: 'Shitni telefonda yig‘asiz: dinreyka, avtomat, UZO, UKK, nol shina — hammasini xohlagan joyga qo‘yasiz va simlarni ulaysiz. Ilova tekshiradi, keyin rasmini chiqarib shit eshigiga yopishtirasiz va shunga qarab yig‘asiz.', s: [
      { sel: '#mEdit', h: '✏ Yig‘ish', d: 'Pastdagi ro‘yxatdan qurilmani tanlab dinreykaning istalgan joyiga qo‘ying. «UKK / nol shina» bo‘limida UKK bloklari va dinreykaga o‘rnatiladigan nol shinalar bor — ularni ham xohlagan joyga qo‘yasiz. Simni klemmadan klemmaga tortib ulaysiz.' },
      { sel: '#mTest', h: '⚡ Tekshiruv', d: 'Ilova sxemani tekshiradi: qisqa tutashuv, ingichka sim, ulanmagan klemma. Avtomatlarni yoqib-o‘chirib, tok qayerga borishini ko‘rasiz.' },
      { sel: '#mOut', h: '🖨 Chiqarish', d: 'Sxema yig‘ilib, tekshiruvdan o‘tgach bosing. A4 varaq tayyorlanadi: sxema rasmi, qurilmalar ro‘yxati va QR kod. «🖨 Printerdan chiqarish» yoki «📤 Rasm sifatida yuborish». Varaqni shit eshigining ichiga yopishtiring va shunga qarab yig‘ing.' },
      { sel: '#mOut', h: '🔳 QR kod — 3D', d: 'Varaqdagi QR kodni istalgan telefon kamerasi bilan skaner qilsa, ilovasiz ham shitning haqiqiy 3D ko‘rinishi ochiladi. Mijozga yoki shogirdga ko‘rsatish uchun.' },
      { sel: '#mOut', h: '✅ Yig‘ish ro‘yxati', d: '«Chiqarish» oynasida. Har bir qurilma (qaysi qator, nechanchi joy) va har bir sim ro‘yxati. Bajarganingizni belgilab borasiz — hammasi tugasa ilova aytadi.' },
      { sel: '#b3d', h: '🧊 3D', d: 'Shitning 3D ko‘rinishi: barmoq bilan aylantiring, «Rentgen» — ichini ko‘rish.' },
      { sel: '#bImg', h: '🖼 Rasm', d: 'Faqat sxemaning rasmini yuboradi.' }] },
    hm: { t: '👛 Hamyon', i: 'Kunlik xarajat va kirimlaringizni yozib borasiz. Ilova hisobot beradi, limitdan oshsangiz yoki o\'tgan oydan ko\'p sarflasangiz ogohlantiradi. Telegram bot bilan ma\'lumot bir xil. ↔ Barmoq bilan yonga suring: o‘ngdan chapga — keyingi bo‘lim, chapdan o‘ngga — oldingi bo‘lim; bo‘limi yo‘q ichki oynada — bir qadam orqaga. «Orqaga» tugmasi ham har safar bitta qadam qaytaradi. ⟳ Tepadan pastga tortsangiz — ma‘lumot serverdan yangilanadi, turgan joyingiz o‘zgarmaydi. ✕ Yarim ekran oynani yopsangiz («Yopish», «✕» yoki tashqarisini bosish) — bitta qadam orqaga: oldingi oyna qaytadi, bosh menyuga chiqib ketmaydi.', s: [
      { sel: '.hero', h: '💰 Shu oy', d: 'Katta raqam — shu oyda jami qancha sarflaganingiz. Pastida: «Bugun» — bugungi xarajat, «Kirim» — shu oy tushgan pul, «Qoldiq» — kirim minus xarajat (minus bo\'lsa, kirimdan ko\'p sarflagansiz). Oq chiziq — oylik limitdan qanchasi ishlatilgani.' },
      { sel: '.alert', h: '⚠️ Ogohlantirish', d: 'Sariq — limitning 80% idan oshdi. Qizil — limitdan oshib ketdi. 📈 — o\'tgan oyning shu kunigacha bo\'lgandan ko\'p sarflayapsiz.' },
