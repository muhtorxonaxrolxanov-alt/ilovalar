 <button data-tab="home" class="on"><b>🏠</b>Asosiy</button><button data-tab="rep"><b>📊</b>Hisobot</button>

<script>
var module={exports:{}};

/* Hamyon — umumiy hisob mantig'i (bot ishlatadi; ilovada xuddi shu qoidalar JS da takrorlangan). */
const CATS = {
  x: [
    ['oziq', '🛒', 'Oziq-ovqat', 'non sut gosht go\'sht meva sabzavot bozor magazin market makro korzinka havas yog un guruch shakar choy tuxum kartoshka piyoz oziq ovqat produkt suv'],
    ['kafe', '🍽', 'Kafe, tushlik', 'kafe obed tushlik nonushta kechki osh somsa lavash shashlik restoran fastfud kofe coffee burger pizza choyxona ovqat'],
    ['trans', '🚕', 'Transport', 'taksi taxi yandex metro avtobus marshrut bus yol yo\'l kira transport poyezd samolyot bilet'],
    ['yoqilgi', '⛽', 'Yoqilg\'i, mashina', 'benzin metan propan zapravka zaprafka yoqilgi yoqilg\'i moy mashina avto shina balon moyka stoyanka jarima zapchas zapchast ehtiyot akkumulyator tormoz kolodka antifriz'],
    ['uy', '🏠', 'Uy-joy, ijara', 'ijara kvartira uy remont mebel jihoz'],
    ['kom', '💡', 'Kommunal', 'svet elektr tok gaz suv kommunal musor issiqlik kvitansiya'],
    ['aloqa', '📱', 'Aloqa, internet', 'telefon internet aloqa paynet ucell beeline mobiuz uzmobile humans tarif'],
    ['kiyim', '👕', 'Kiyim-kechak', 'kiyim oyoq kiyim krossovka poyabzal futbolka shim kurtka ko\'ylak'],
    ['salomat', '💊', 'Salomatlik', 'dori apteka shifokor vrach klinika tahlil stomatolog tish kasalxona'],
    ['talim', '📚', 'Ta\'lim', 'kurs kitob talim ta\'lim maktab universitet kontrakt repetitor daftar'],
    ['bola', '🧸', 'Bolalar', 'bola bolalar pampers o\'yinchoq oyinchoq bogcha bog\'cha'],
    ['oyin', '🎉', 'Ko\'ngilochar', 'kino o\'yin oyin dam sayohat park konsert'],
    ['sovga', '🎁', 'To\'y, sovg\'a', 'to\'y toy sovga sovg\'a tugilgan tug\'ilgan hadya gul marosim'],
    ['kredit', '🏦', 'Kredit, bo\'lib to\'lash', 'kredit ipoteka rassrochka bolib bo\'lib to\'lov uzum alif'],
    ['xayr', '🤲', 'Xayr-ehson', 'sadaqa xayr ehson zakot fitr'],
    ['boshqa', '📦', 'Boshqa', ''],
  ],
  i: [
    ['maosh', '💼', 'Maosh', 'oylik maosh zarplata avans bonus premiya'],
    ['biznes', '💰', 'Savdo, biznes', 'savdo foyda biznes sotdim tushum daromad'],
    ['sovgai', '🎁', 'Sovg\'a', 'sovga sovg\'a hadya'],
    ['boshqai', '➕', 'Boshqa kirim', ''],
  ],
};
const CAT = {}; for (const t of ['x', 'i']) for (const [k, em, n] of CATS[t]) CAT[k] = { k, em, n, t };
const catName = k => (CAT[k] ? CAT[k].em + ' ' + CAT[k].n : '📦 Boshqa');

const TZ = 5 * 36e5;
const dayOf = ts => new Date((ts || Date.now()) + TZ).toISOString().slice(0, 10);
const money = n => Math.round(+n || 0).toLocaleString('ru-RU').replace(/\s/g, ' ') + " so'm";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const lc = s => String(s || '').toLowerCase().replace(/[‘’`ʻʼ]/g, "'").replace(/o'/g, 'o\'').trim();
function guessCat(text, t) {
  const w = ' ' + lc(text).replace(/[^a-z'а-яё0-9 ]/g, ' ') + ' ';
  for (const [k, , , kw] of CATS[t]) for (const x of kw.split(' ').filter(Boolean)) if (w.includes(' ' + x)) return k;
  return t === 'i' ? 'boshqai' : 'boshqa';
}
const INC = /(^|\s)(kirim|oylik|maosh|zarplata|avans|bonus|premiya|tushdi|tushum|foyda|daromad|sotdim)(\s|$)/;
/* So'z bilan aytilgan sonlar: "besh yuz ming" -> 500000, "bir yarim million" -> 1500000 (ovozdan kelgan matn uchun) */
const NW = { bir: 1, ikki: 2, uch: 3, "to'rt": 4, tort: 4, besh: 5, olti: 6, yetti: 7, sakkiz: 8, "to'qqiz": 9, toqqiz: 9, "o'n": 10,
  yigirma: 20, "o'ttiz": 30, ottiz: 30, qirq: 40, ellik: 50, oltmish: 60, yetmish: 70, sakson: 80, "to'qson": 90, toqson: 90 };
const SC = { yuz: 100, ming: 1e3, million: 1e6, mln: 1e6, milion: 1e6, milliard: 1e9 };
function wordsToNum(s) {
  const tk = s.split(/\s+/), out = []; let i = 0;
  const base = w => { const m = w.match(/^(.*?)(ga|lik|dan|ni|gacha)?$/); for (const b of [w, m[1]]) if (NW[b] !== undefined || SC[b] !== undefined || b === 'yarim') return { b, suf: b === w ? '' : m[2] }; return null; };
  while (i < tk.length) {
    let j = i, tot = 0, cur = 0, any = false, suf = '';
    for (; j < tk.length; j++) {
      const r = base(tk[j]); if (!r) break; const w = r.b;
      if (NW[w] !== undefined) { cur += NW[w]; any = true; }
      else if (w === 'yarim') { cur += 0.5; any = true; }
      else if (w === 'yuz') { cur = (cur || 1) * 100; any = true; }
      else if (SC[w]) { if (!any && /^\d/.test(out[out.length - 1] || '')) break; tot += (cur || 1) * SC[w]; cur = 0; any = true; }
      suf = r.suf; if (suf) { j++; break; }
    }
    if (any && j > i && (tot + cur) > 0) { out.push(String(tot + cur)); i = j; } else { out.push(tk[i]); i++; }
  }
  return out.join(' ');
}
const AMT = /(\d+(?:[.,]\d+)?)\s*(mln|million|milion|млн|ming|минг|тыс|k(?![a-z'])|к(?![а-яё]))?(?:\s*(?:so'm|som|сум)\w*)?/g;
const FILL = /(^|\s)(va|yana|keyin|hamda|ham|so'mga|so'mlik|so'm|som|uchun|deb|xullas)(?=\s|$)/g;
/* "non 5000, taksi 20 ming, oylik 5 mln" yoki ovozdan: "500 mingga zapchas oldim 200 mingga zapravka qildim" -> [{t,a,c,n}] ; tushunmasa [] */
function parseText(text) {
  const out = [];
  for (const part of String(text || '').split(/;|\n|,(?!\d)|\.(?!\d)/)) {
    let s = lc(part).replace(/(\d)[ .](?=\d{3}(\D|$))/g, '$1').replace(/(\d)[ .](?=\d{3}(\D|$))/g, '$1');
    s = wordsToNum(s.replace(/\s+/g, ' ').trim());
    const ms = [...s.matchAll(AMT)].filter(m => { const v = parseFloat(m[1].replace(',', '.')); return v > 0 && (m[2] || v >= 100); }); // birliksiz 100 dan kichik son — miqdor (2 ta, 3 kg)
    if (!ms.length) continue;
    const numFirst = /^\s*\d/.test(s);
    ms.forEach((m, k) => {
      let a = parseFloat(m[1].replace(',', '.')); const u = m[2] || '';
      if (/^(mln|million|milion|млн)$/.test(u)) a *= 1e6; else if (/^(ming|минг|тыс|k|к)$/.test(u)) a *= 1e3;
      const end = m.index + m[0].length, nx = ms[k + 1], pv = ms[k - 1];
      let note = ms.length === 1 ? s.slice(0, m.index) + ' ' + s.slice(end)
        : numFirst ? s.slice(end, nx ? nx.index : s.length) : s.slice(pv ? pv.index + pv[0].length : 0, m.index);
      note = note.replace(/^(ga|lik|ta)(?=\s|$)/, '').replace(FILL, ' ').replace(/\s+/g, ' ').trim().replace(/^[-–:]+|[-–:]+$/g, '').trim();
      const t = INC.test(' ' + note + ' ') ? 'i' : 'x';
      out.push({ t, a: Math.round(a), c: guessCat(note, t), n: note.slice(0, 80) });
    });
  }
  return out;
}

/* "Abdullohga qarz berdim 15 ming" / "Sodiqdan qarz oldim" -> qarz yozuvi (xarajat/kirim emas) */
function debtOf(x) {
  const n = lc(x && x.n); if (!/(^|\s)qarz/.test(n)) return null;
  const dir = /oldim|olindi|berishdi/.test(n) ? 'o' : /berdim|berildi/.test(n) ? 'b' : (x.t === 'i' ? 'o' : 'b');
  let who = n.split(/\s*qarz/)[0].replace(/(ga|dan|ning|ni)$/, '').trim();
  who = who ? who.replace(/(^|\s)\S/g, c => c.toUpperCase()) : 'Noma\'lum';
  return { who: who.slice(0, 40), a: x.a, dir };
}
/* ---- Ma'lumot:{e:[{id,t,a,c,n,d,ts}], del:{id:1}, lim:{m,d,c:{},ts}, debts:[{id,who,a,dir,d,back,ts}], v:1} ---- */
const empty = () => ({ v: 1, e: [], del: {}, lim: { m: 0, d: 0, c: {}, ts: 0 }, debts: [] });
function norm(d) { d = d || {}; const z = empty(); return Object.assign(z, d, { e: d.e || [], del: d.del || {}, lim: Object.assign(z.lim, d.lim || {}), debts: d.debts || [] }); }
function merge(a, b) {
  a = norm(a); b = norm(b);
  const del = Object.assign({}, a.del, b.del), seen = new Map();
  for (const x of a.e.concat(b.e)) { const o = seen.get(x.id); if (!o || (x.ts || 0) > (o.ts || 0)) seen.set(x.id, x); }
  const dm = new Map(); for (const x of a.debts.concat(b.debts)) { const o = dm.get(x.id); if (!o || (x.ts || 0) > (o.ts || 0)) dm.set(x.id, x); }
  return { v: 1, del, e: [...seen.values()].filter(x => !del[x.id]).sort((p, q) => (p.d + p.ts) < (q.d + q.ts) ? -1 : 1),
    lim: (a.lim.ts || 0) >= (b.lim.ts || 0) ? a.lim : b.lim, debts: [...dm.values()].filter(x => !del[x.id]) };
}

/* ---- Hisob ---- */
function addMonths(ds, k) { const [y, m] = ds.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + k, 1)); return d.toISOString().slice(0, 7); }
function range(per, today) {
  today = today || dayOf();
  const D = s => new Date(s + 'T00:00:00Z'), F = d => d.toISOString().slice(0, 10), add = (s, n) => F(new Date(D(s).getTime() + n * 864e5));
  if (per === 'd') return { a: today, b: today, pa: add(today, -1), pb: add(today, -1), name: 'Bugun', pname: 'kecha' };
  if (per === 'w') { const wd = (D(today).getUTCDay() + 6) % 7, a = add(today, -wd); return { a, b: today, pa: add(a, -7), pb: add(today, -7), name: 'Shu hafta', pname: "o'tgan haftaning shu kunigacha" }; }
  if (per === 'y') { const y = today.slice(0, 4), py = String(+y - 1); return { a: y + '-01-01', b: today, pa: py + '-01-01', pb: py + today.slice(4), name: y + '-yil', pname: "o'tgan yilning shu kunigacha" }; }
  const m = today.slice(0, 7), pm = addMonths(today, -1), dd = today.slice(8);
  const plast = new Date(Date.UTC(+pm.slice(0, 4), +pm.slice(5), 0)).getUTCDate();
  return { a: m + '-01', b: today, pa: pm + '-01', pb: pm + '-' + String(Math.min(+dd, plast)).padStart(2, '0'), name: 'Shu oy', pname: "o'tgan oyning shu kunigacha" };
}
function sum(data, a, b, t) { let s = 0; for (const x of norm(data).e) if (x.t === (t || 'x') && x.d >= a && x.d <= b) s += +x.a || 0; return s; }
function byCat(data, a, b, t) { const m = {}; for (const x of norm(data).e) if (x.t === (t || 'x') && x.d >= a && x.d <= b) m[x.c] = (m[x.c] || 0) + (+x.a || 0); return Object.entries(m).sort((p, q) => q[1] - p[1]); }
const pct = (a, b) => b > 0 ? Math.round((a - b) / b * 100) : null;

/* Yangi xarajatdan keyingi ogohlantirishlar (matnlar ro'yxati) */
function alerts(data, today, entry) {
  data = norm(data); today = today || dayOf(); const L = data.lim, out = [];
  const M = range('m', today), mx = sum(data, M.a, M.b), dx = sum(data, today, today);

    it.forEach(x=>{const q=K.debtOf(x);if(q)dbs.push(Object.assign({id:K.uid(),d:today0,back:0,ts:Date.now()},q));else ents.push(Object.assign({id:K.uid(),d:today0,ts:Date.now(),src:'ovoz'},x))});

      dbs.map(q=>`<div class="it"><div class="em">${q.dir==='b'?'📤':'📥'}</div><div class="g"><div class="t">Qarz: ${esc(q.who)}</div><div class="n">${q.dir==='b'?'Men berdim':'Men oldim'}</div></div><div class="amt">${fmt(q.a)}</div></div>`).join('')+
      al.map(a=>`<div class="alert ${/🔴/.test(a)?'r':''}">${esc(a)}</div>`).join('')+`<p class="s mut" style="margin:4px 2px 10px">Xato bo'lsa, yozuvni bosib tuzating.</p><div class="row"><button class="btn g" id="vu">↩️ Bekor qilish</button><button class="btn" id="vo">Tayyor</button></div>`);
    r.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{r.remove();edit(x.dataset.e)});
    r.querySelector('#vo').onclick=()=>r.remove();
    r.querySelector('#vu').onclick=()=>{const ids=ents.concat(dbs).map(e=>e.id);change(D=>{ids.forEach(i=>D.del[i]=1);D.e=D.e.filter(x=>!ids.includes(x.id));D.debts=D.debts.filter(x=>!ids.includes(x.id))});r.remove();toast('Bekor qilindi')};
  }
  if(vb)vb.onclick=start;bg.querySelector('#va').onclick=()=>{stop();add()};
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.classList.contains('xb'))stop()},true);
  if(auto&&can)setTimeout(start,250);
}
function donut(list,tot){
  if(!tot)return'';let a=0,s='';const R=60,C=2*Math.PI*R;
  list.forEach(([c,v],i)=>{const l=v/tot*C;s+=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${COL[i%COL.length]}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 80 80)"/>`;a+=l});
  return `<svg viewBox="0 0 160 160" width="170" height="170" style="display:block;margin:4px auto 10px">${s}<text x="80" y="76" text-anchor="middle" font-size="12" fill="currentColor" opacity=".6">jami</text><text x="80" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${fmt(tot)}</text></svg>`;
}
function vRep(){

  <div class="row" style="margin-top:10px"><div><div class="mut s">Xarajat</div><b class="amt x" style="font-size:20px">${fmt(x)}</b></div><div><div class="mut s">Kirim</div><b class="amt i" style="font-size:20px">${fmt(i)}</b></div><div><div class="mut s">Qoldiq</div><b style="font-size:20px">${fmt(i-x)}</b></div></div>
  ${px>0&&p!==null?`<div class="cmp">${p>0?'📈':'📉'} ${esc(R.pname)}: ${M(px)} — <b style="color:${p>0?'var(--red)':'var(--grn)'}">${p>0?'+':''}${p}%</b></div>`:''}</div>`;
  // ustunli grafik
  let bars=[];
  if(per==='y'){for(let m=1;m<=12;m++){const mm=R.a.slice(0,4)+'-'+String(m).padStart(2,'0');bars.push([MON[m-1].slice(0,3),K.sum(d,mm+'-01',mm+'-31'),mm===t.slice(0,7)])}}
  else if(per!=='d'){const D=s=>new Date(s+'T00:00:00Z');for(let q=D(R.a);q<=D(R.b);q=new Date(q.getTime()+864e5)){const s=q.toISOString().slice(0,10);bars.push([per==='w'?['Du','Se','Ch','Pa','Ju','Sh','Ya'][(q.getUTCDay()+6)%7]:String(+s.slice(8)),K.sum(d,s,s),s===t])}}
  if(bars.length){const mx=Math.max(1,...bars.map(b=>b[1]));h+=`<div class="card"><b>Xarajat dinamikasi</b><div class="bars">${bars.map(b=>`<div class="${b[2]?'t':''}" style="height:${b[1]/mx*100}%" title="${fmt(b[1])}"></div>`).join('')}</div><div class="bl">${bars.map((b,j)=>`<span>${bars.length>16&&j%5&&j!==bars.length-1?'':b[0]}</span>`).join('')}</div>${bars.length>1?`<div class="s mut" style="margin-top:6px">O'rtacha: ${M(x/Math.max(1,bars.filter(b=>!b[2]||true).length))} / ${per==='y'?'oy':'kun'}</div>`:''}</div>`}
  h+=`<div class="card"><b>Turkumlar bo'yicha</b>`+(cs.length?donut(cs,x)+cs.map(([c,v],j)=>{const C=K.CAT[c]||K.CAT.boshqa,pv=K.sum({e:d.e.filter(e=>e.c===c)},R.pa,R.pb),pp=K.pct(v,pv);return `<div class="leg" data-c="${c}"><span class="dot" style="background:${COL[j%COL.length]}"></span><span class="g">${C.em} ${esc(C.n)}<br><span class="s mut">${Math.round(v/x*100)}%${pp!==null&&pv>0?` · ${pp>0?'+':''}${pp}% oldingiga nisbatan`:''}</span></span><b>${fmt(v)}</b></div>`}).join(''):'<div class="empty" style="padding:16px">Bu davrda xarajat yo\'q</div>')+`</div>`;

  app.querySelectorAll('.leg[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c,L=S.data.e.filter(e=>e.c===c&&e.t==='x'&&e.d>=R.a&&e.d<=R.b).sort((a,b2)=>a.d<b2.d?1:-1);
    const bg=sheet(`<div class="sh-h"><b>${K.CAT[c].em} ${esc(K.CAT[c].n)}</b><button class="xb">✕</button></div>`+L.map(e=>`<div class="it" data-e="${e.id}"><div class="g"><div class="t">${dname(e.d)}</div>${e.n?`<div class="n">${esc(e.n)}</div>`:''}</div><div class="amt x">−${fmt(e.a)}</div></div>`).join(''));
    bg.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{bg.remove();edit(x.dataset.e)})});
}
function vLim(){

function vDebt(){
  const D=S.data.debts.slice().sort((a,b)=>(a.back-b.back)||(a.d<b.d?1:-1)),act=D.filter(x=>!x.back);

  let h=`<h1>Qarzlar</h1><div class="card"><div class="row"><div><div class="mut s">Sizdan olishlari kerak</div><b class="amt i" style="font-size:20px">${fmt(give)}</b></div><div><div class="mut s">Siz berishingiz kerak</div><b class="amt x" style="font-size:20px">${fmt(take)}</b></div></div></div>

function debt(id){
  const o=id?S.data.debts.find(x=>x.id===id):null;let dir=o?o.dir:'b';
  const bg=sheet(`<div class="sh-h"><b>${o?'Qarz':'Yangi qarz'}</b><button class="xb">✕</button></div><div class="seg"><button data-r="b">📤 Men berdim</button><button data-r="o">📥 Men oldim</button></div>

  const da=bg.querySelector('#da');da.oninput=()=>{const v=da.value.replace(/\D/g,'');da.value=v?fmt(+v):''};
  bg.querySelector('#ds').onclick=()=>{const a=+da.value.replace(/\D/g,''),w=bg.querySelector('#wh').value.trim();if(!w||!a)return toast('Ism va summani yozing');
    change(D=>{const x=o&&D.debts.find(y=>y.id===o.id);const v={who:w,a,dir,due:bg.querySelector('#du').value,ts:Date.now()};if(x)Object.assign(x,v);else D.debts.push(Object.assign({id:K.uid(),d:today(),back:0},v))});bg.remove();toast('✅ Saqlandi')};
  if(bg.querySelector('#db'))bg.querySelector('#db').onclick=()=>{change(D=>{const x=D.debts.find(y=>y.id===o.id);x.back=Date.now();x.ts=Date.now()});bg.remove()};
  if(bg.querySelector('#dx'))bg.querySelector('#dx').onclick=()=>{if(!confirm('O\'chirilsinmi?'))return;change(D=>{D.del[o.id]=1;D.debts=D.debts.filter(y=>y.id!==o.id)});bg.remove()};
