<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilovani yuklab olish</title>
<style>
:root{--bg:#F6EFE3;--card:#fff;--ink:#2a1a0e;--mut:#6b5a4a;--pri:#1f6feb;--and:#1a8f3c;--ios:#111}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#211d19;--ink:#f3ece4;--mut:#b5a898}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:520px;margin:0 auto;padding:24px 16px 48px}
.app{background:var(--card);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:16px}.hd img{width:64px;height:64px;border-radius:16px;flex:none}
h1{font-size:22px;margin:0}.s{color:var(--mut);font-size:14px;margin-top:4px}
.b{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:700;color:#fff;text-decoration:none;margin-top:10px;cursor:pointer}
.ios{background:var(--ios)}.and{background:var(--and)}.pri{background:var(--pri)}
.st{display:none;margin-top:12px;background:rgba(127,127,127,.1);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.5}
.st.on{display:block}.st ol{margin:6px 0 0;padding-left:22px}.st li{margin:6px 0}
.warn{background:#fff3cd;color:#5c4400;border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:8px}
</style></head><body><div class="w" id="w"></div>
<script>
var S='https://muhtorxonaxrolxanov-alt.github.io/ilovalar/';
var A={
 'hisob':[{n:'Hisob-kitob',s:'Hisobot ilovasi',u:'hisob/',i:'hisob/icon-192.png',apk:'hisob-kitob.apk'}],
 'toshkent-rahbar':[{n:'Toshkent nonvoyxona',s:'Rahbar ilovasi',u:'nonvoyxona/toshkent-rahbar/',i:'nonvoyxona/toshkent-rahbar/icon-192.png',apk:'toshkent-rahbar.apk'}],
 'toshkent-hodim':[{n:'Toshkent nonvoyxona',s:'Hodim ilovasi',u:'nonvoyxona/toshkent-hodim/',i:'nonvoyxona/toshkent-hodim/icon-192.png',apk:'toshkent-hodim.apk'}],
 'namangan-rahbar':[{n:'Namangan nonvoyxona',s:'Rahbar ilovasi',u:'nonvoyxona/namangan-rahbar/',i:'nonvoyxona/namangan-rahbar/icon-192.png',apk:'namangan-rahbar.apk'}],
 'namangan-hodim':[{n:'Namangan nonvoyxona',s:'Hodim ilovasi',u:'nonvoyxona/namangan-hodim/',i:'nonvoyxona/namangan-hodim/icon-192.png',apk:'namangan-hodim.apk'}],
 'dokon':[{n:'222 Aksessuar Sotuvchi',s:'Do\'kon egasi uchun',u:'dokon/sotuvchi/',i:'dokon/sotuvchi/icon-192.png',apk:'dokon-sotuvchi.apk'},
          {n:'222 Aksessuar',s:'Mijozlar uchun (xaridorlar)',u:'dokon/mijoz/',i:'dokon/mijoz/icon-192.png',apk:'dokon-mijoz.apk'}]
};
A['hamyon']=[{n:'Hamyon',s:'Kunlik xarajatlar hisobi · bot: @hamyon_kunlik_hisob_bot',u:'hamyon/',i:'hamyon/icon-192.png',apk:'hamyon.apk'}];
A['dokon-sotuvchi']=[A.dokon[0]];A['dokon-mijoz']=[A.dokon[1]];
/* Shogird: ustaning taklif havolasi (?a=shogird&taklif=KOD). Avval o'z «Shogird» ilovasini o'rnatadi, keyin ichida kod bilan ro'yxatdan o'tadi. */
var TK=((location.search.match(/[?&]taklif=([A-Za-z0-9]{8})/)||[])[1]||'').toUpperCase();
A['shogird']=[{n:'Shogird — Hisob-kitob',s:'Ustangiz jamoasiga qo\'shilish va ish kunlarini yozish',u:'shogird/'+(TK?'?taklif='+TK:''),i:'shogird/icon-192.png',apk:''}];
try{if(TK)localStorage.setItem('hk_taklif',TK)}catch(e){}
var k=(location.search.match(/[?&]a=([\w-]+)/)||[])[1],L=A[k],ua=navigator.userAgent;
var isI=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isA=/Android/.test(ua);
var inApp=/Telegram|FBAN|FBAV|Instagram|Line\//.test(ua)||(isI&&!/Safari/.test(ua));
/* Android: ilovani aynan Chrome'da ochamiz (Telegram ichidan ham) — o'rnatish Chrome orqali bo'ladi */
function cr(u){var h=S+u.replace(/\?.*$/,'')+'o.html';if(!isA)return h;return 'intent://'+h.replace(/^https:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(h)+';end'}
/* iPhone: o'rnatish faqat Safari'da (Ulashish → Bosh ekranga qo'shish). Telegram/boshqa ilova ichida bo'lsa — x-safari-https:// bilan Safari'ni o'zi ochamiz (iOS 17+) */
var iosApp=isI&&(!/Safari\//.test(ua)||/CriOS|FxiOS|EdgiOS|Telegram/.test(ua));
function io(u){var h=S+u.replace(/\?.*$/,'')+'o.html'+((u.match(/\?.*$/)||[''])[0]);return iosApp?'x-safari-'+h:h}
function e(s){return String(s).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
var w=document.getElementById('w');
if(!L){var h='<h1 style="margin:8px 0 16px">Ilovalar</h1>';for(var x in A){if(x.indexOf('dokon-')==0)continue;A[x].forEach(function(a){h+='<a class="b pri" href="?a='+x+'">'+e(a.n+' — '+a.s)+'</a>'})}w.innerHTML=h}
else{document.title=L[0].n+' — yuklab olish';w.innerHTML=L.map(function(a,j){return '<div class="app"><div class="hd"><img src="'+S+a.i+'" alt="" onerror="this.style.display=\'none\'"><div><h1>'+e(a.n)+'</h1><div class="s">'+e(a.s)+'</div></div></div>'+
 '<button class="b ios" onclick="t(\'i'+j+'\')">&#128241; iPhone uchun</button>'+
 '<div class="st" id="i'+j+'"><a class="b pri" href="'+io(a.u)+'">📲 O\'rnatish</a>'+
 '<ol><li>Yuqoridagi <b>«📲 O\'rnatish»</b> tugmasini bosing — <b>Safari</b> ochiladi.</li><li>Safari\'da pastdagi <b>Ulashish</b> belgisini bosing (kvadrat va yuqoriga strelka ⬆).</li><li><b>«Bosh ekranga qo\'shish»</b> (На экран «Домой») → <b>Qo\'shish</b>.</li><li>Telefon ekranida ilova belgisi paydo bo\'ladi — endi shundan oching.</li></ol>'+
 (iosApp?'<div class="warn">Safari ochilmasa: yuqori o\'ngdagi <b>«⋯»</b> → <b>«Safari\'da ochish»</b>, keyin yana «📲 O\'rnatish».</div>':'')+'</div>'+
 '<button class="b and" onclick="t(\'a'+j+'\')">&#129302; Android uchun</button>'+
 '<div class="st" id="a'+j+'"><a class="b and" href="'+cr(a.u)+'">📲 O\'rnatish (Chrome orqali)</a>'+
 '<ol><li>Yuqoridagi tugmani bosing.</li><li>Ochilgan sahifada <b>«📲 Telefonga o\'rnatish»</b> → <b>O\'rnatish</b>.</li><li>Ilova telefon ekraniga va ilovalar ro\'yxatiga tushadi — oddiy ilovadek, o\'z belgisi bilan, butun ekranda ochiladi.</li></ol>'+
 '<div class="s">✅ Bu usulda «Play Protect … bloklandi» degan ogohlantirish <b>chiqmaydi</b>. Ilova o\'zi yangilanib turadi.</div>'+
 (a.apk?'<details style="margin-top:12px"><summary class="s" style="cursor:pointer">Boshqa yo\'l: APK fayl</summary>'+
 '<a class="b" style="background:#6b7280" href="apk/'+a.apk+'" download>⬇ APK yuklab olish</a>'+
 '<div class="s">Google bu faylni tanimagani uchun «Play Protect» ogohlantirishi chiqishi mumkin. Unda <b>Batafsil → Baribir o\'rnatish</b> ni bosing.</div></details>':'')+'</div></div>'}).join('');
 if(k==='shogird')w.insertAdjacentHTML('afterbegin','<div class="app" style="background:#f0fdf4;border:2px solid #16a34a"><h1 style="font-size:20px">👷 Ustangiz sizni jamoasiga taklif qildi</h1>'+
  '<ol style="font-size:16px;line-height:1.6;padding-left:22px"><li><b>Avval</b> pastdan o\'z «Shogird» ilovangizni telefonga o\'rnating.</li><li>Telefon ekranidagi <b>«Shogird»</b> belgisini bosib oching.</li><li>Parol o\'ylab toping — ro\'yxatdan o\'tasiz va ustangiz jamoasiga qo\'shilasiz.</li></ol>'+
  (TK?'<div style="margin-top:10px;font-size:15px">Taklif kodingiz (ilova so\'rasa yozing):</div><div style="font-size:30px;font-weight:800;letter-spacing:4px;margin:4px 0">'+e(TK)+'</div>':'')+'</div>');
 if(L.length==1){if(isI)t('i0');else if(isA)t('a0')}}
function t(id){document.getElementById(id).classList.toggle('on')}
</script></body></html>
